# VoiceFi Configuration
# Place this file at ~/.voicefi/config.yaml or in your working directory as config.yaml

version: 1

# Tier: "community" (free open-source) or "pro"
tier: "community"
license_key: "" # Leave empty for community tier
posthog_api_key: "" # PostHog API Key for telemetry and error tracking

# Text-to-Speech (TTS) Settings
tts:
  # Providers: "edge_tts" (neural high quality), "mac_say" (fast, built-in macOS), "elevenlabs" (pro)
  provider: "edge_tts"
  
  # For edge_tts: "en-US-AvaNeural" (Viv), "en-US-ChristopherNeural", "en-US-GuyNeural", "en-US-JennyNeural"
  # For mac_say: "Ava (Premium)", "Samantha", "Alex", "Daniel", "Karen", or any macOS voice
  voice: "en-US-AvaNeural"
  rate: 200        # Words per minute (mac_say) or speed percentage (edge_tts)
  volume: 1.0
  streaming: true  # Stream audio chunks with sub-250ms time-to-first-byte playback
  elevenlabs_api_key: ""
  elevenlabs_voice_id: "21m00Tcm4TlvDq8ikWAM" # Rachel

# Speech-to-Text (STT) Settings
stt:
  # Providers: "whisper_local" (offline faster-whisper), "groq" (fast cloud), "apple_speech"
  provider: "whisper_local"
  
  # Local whisper model size: "tiny.en", "base.en", "small.en", "medium.en"
  model_size: "base.en"
  language: "en"
  streaming: false # Enable live sliding-window streaming transcription
  
  # Groq Cloud Whisper settings (requires free api key from console.groq.com)
  groq_api_key: ""
  groq_model: "whisper-large-v3-turbo"

# Voice Activity Detection (VAD) & Recording
vad:
  mode: "hybrid"           # "hybrid" (Tap=Auto / Hold=PTT) | "ptt" (Push-to-Talk) | "auto" (Auto-VAD)
  silence_duration: 2.0    # Seconds of silence after speech to stop recording (in auto mode)
  energy_threshold: 0.003  # RMS energy threshold (automatically calibrated)
  max_record_seconds: 45   # Maximum single recording duration
  sample_rate: 16000       # Sample rate for STT (16kHz standard)
  ptt_release_delay_ms: 150 # Trailing buffer on key release to prevent clipped speech
  barge_in: "auto"         # "auto" (AirPods/Headphones=On, Built-in Speakers=Safe) | true | false
  barge_in_sensitivity: 1.0 # Sensitivity multiplier for barge-in voice detection

# Audio Feedback Cues
audio_cues:
  enabled: true
  start_chime: "/System/Library/Sounds/Tink.aiff"
  sent_chime: "/System/Applications/Mail.app/Contents/Resources/Mail Sent.aiff"
  done_chime: "/System/Applications/Mail.app/Contents/Resources/Mail Sent.aiff"
  error_chime: "/System/Library/Sounds/Basso.aiff"

# Antigravity Pair-Programming Integration
antigravity:
  auto_listen: true            # Automatically start listening after speaking agent turn
  read_summary_aloud: true     # Speak agent turn summary
  max_spoken_words: 60         # Summarize agent turn to brief soundbite
  inject_to_active_window: true # Type/submit transcribed text to the active application

# Unified Dynamic Island HUD
hud:
  enabled: true                # Enable Dynamic Island floating HUD
  persistent: true             # Keep resting pill visible ("🎙️ VoiceFi • Ready")
  auto_send: true              # Instant prompt submission (false = review & edit mode)
  show_live_transcript: true   # Stream live transcription tokens
  fullscreen_overlay: true     # true = always on top of full-screen games/apps; false = allow full-screen overlap
  position: "top_center"       # "top_center" | "top_right" | "bottom_right"
  linger_seconds: 2.0          # Seconds to linger after done/speaking

# Global Desktop Dictation Hotkeys
global_hotkey:
  enabled: true
  talk_to_agent_hotkey: "<alt>+v"         # Option + V / Alt + V to Prompt active agent
  focus_and_talk_hotkey: "<ctrl>+r"       # Control + R to Respond to active agent
  jump_to_agent_hotkey: "<ctrl>+j"        # Control + J to Jump/Focus Antigravity
  hub_hotkey: "<ctrl>+<shift>+j"          # Control + Shift + J to toggle Activity Hub
  new_conversation_hotkey: "<cmd>+<shift>+n" # Command + Shift + N to start New Conversation with Connected Tools
  dictate_hotkey: "<ctrl>+t"             # Control + T for Talk (dictate anywhere)

# Per-Agent Voice Personas (Agent-First Customization)
agents:
  antigravity:
    provider: "edge_tts"
    voice: "en-US-AvaNeural"
  claude_code:
    provider: "edge_tts"
    voice: "en-US-GuyNeural"
  cursor:
    provider: "edge_tts"
    voice: "en-US-JennyNeural"
  obsidian:
    provider: "edge_tts"
    voice: "en-US-EmmaNeural"
  aria:
    provider: "edge_tts"
    voice: "en-US-EmmaNeural"

# Distinct Subagent Personas by Role
subagents:
  researcher:
    provider: "edge_tts"
    voice: "en-GB-SoniaNeural"
  debugger:
    provider: "edge_tts"
    voice: "en-US-EmmaNeural"
  architect:
    provider: "edge_tts"
    voice: "en-AU-WilliamNeural"

