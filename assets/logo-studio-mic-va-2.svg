<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Stark White Canvas -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Minimalist Frame -->
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#EAEAEA" stroke-width="1.5"/>

  <!-- Technical Header -->
  <text x="52" y="58" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">HYBRID 02 // BROADCAST APERTURE</text>
  <rect x="264" y="48" width="60" height="14" fill="#D4FF00"/>
  <text x="294" y="59" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" text-anchor="middle" letter-spacing="1">STUDIO V/A</text>
  <text x="460" y="58" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">VOICEGENCY</text>

  <!-- THE BROADCAST STUDIO MIC + V/A HYBRID -->
  <g id="broadcastMicVA2" transform="translate(0, 14)">
    
    <!-- Top Broadcast Grille Cap (Flat Precision Header) -->
    <rect x="180" y="70" width="152" height="14" fill="#000000"/>
    <rect x="196" y="88" width="120" height="8" fill="#D4FF00"/>

    <!-- THE 'V' BODY / TAPERED MIC CASING - Solid Black Slabs -->
    <polygon points="120,104 186,104 256,368 220,368" fill="#000000"/>
    <polygon points="392,104 326,104 256,368 292,368" fill="#000000"/>

    <!-- Internal Broadcast Acoustic Grille Slats (Upper Chamber) -->
    <g fill="#000000">
      <rect x="194" y="108" width="124" height="6"/>
      <rect x="204" y="122" width="104" height="6"/>
      <rect x="214" y="136" width="84" height="6"/>
      <rect x="224" y="150" width="64" height="6"/>
      <rect x="234" y="164" width="44" height="6"/>
    </g>

    <!-- Side Acoustic Grille Slots on Outer V Wings -->
    <g fill="#FFFFFF">
      <polygon points="144,124 172,124 162,148 134,148"/>
      <polygon points="158,160 186,160 176,184 148,184"/>
      
      <polygon points="368,124 340,124 350,148 378,148"/>
      <polygon points="354,160 326,160 336,184 364,184"/>
    </g>

    <!-- THE SOLID 'A' CROSSBAR / SHOCKMOUNT CLAMP -->
    <!-- Locks across the V, creating the bold 'A' letterform and mic mounting ring -->
    <rect x="176" y="196" width="160" height="20" fill="#000000"/>
    <rect x="184" y="202" width="144" height="8" fill="#D4FF00"/>

    <!-- Internal Dynamic Capsule Node (Centered on Crossbar) -->
    <circle cx="256" cy="248" r="24" fill="#D4FF00" stroke="#000000" stroke-width="4"/>
    <circle cx="256" cy="248" r="10" fill="#000000"/>

    <!-- Lower V Apex / XLR Ground Connector -->
    <circle cx="256" cy="396" r="12" fill="#000000"/>
    <rect x="240" y="420" width="32" height="12" fill="#000000"/>
    <line x1="256" y1="410" x2="256" y2="432" stroke="#D4FF00" stroke-width="4"/>
  </g>

  <!-- Technical Footer -->
  <text x="52" y="462" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">BROADCAST GRILLE &amp; SHOCKMOUNT</text>
  <text x="460" y="462" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="end">SOLID STENCIL</text>
</svg>
