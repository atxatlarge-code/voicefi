<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure White Canvas -->
  <rect width="512" height="512" fill="#FFFFFF"/>
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#EAEAEA" stroke-width="1.5"/>
  <text x="52" y="58" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">VAR.06 // WAVE DISPERSION YOKE</text>
  <rect x="250" y="48" width="80" height="14" fill="#FF2A2A"/>
  <text x="290" y="59" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" text-anchor="middle">● ON AIR</text>
  <text x="460" y="58" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">VOICEGENCY</text>

  <!-- THE MARK: 06 WAVE DISPERSION YOKE -->
  <g id="var06" transform="translate(0, 10)">
    <!-- Yoke Arms with Acoustic Radiation Ribs -->
    <path d="M 112 136 L 146 136 L 226 370 L 194 370 Z" fill="#000000"/>
    <path d="M 400 136 L 366 136 L 286 370 L 318 370 Z" fill="#000000"/>

    <!-- Acoustic Wave Dispersion Wings on Outer Yoke -->
    <g stroke="#000000" stroke-width="6" stroke-linecap="square">
      <line x1="84" y1="160" x2="104" y2="160"/>
      <line x1="72" y1="184" x2="98" y2="184"/>
      <line x1="64" y1="208" x2="94" y2="208"/>
      <line x1="72" y1="232" x2="100" y2="232"/>
      <line x1="84" y1="256" x2="108" y2="256"/>

      <line x1="428" y1="160" x2="408" y2="160"/>
      <line x1="440" y1="184" x2="414" y2="184"/>
      <line x1="448" y1="208" x2="418" y2="208"/>
      <line x1="440" y1="232" x2="412" y2="232"/>
      <line x1="428" y1="256" x2="404" y2="256"/>
    </g>

    <!-- Inner Mic Body (A) -->
    <path d="M 190 92 C 190 46, 322 46, 322 92 Z" fill="#000000"/>
    <rect x="210" y="70" width="92" height="8" fill="#FF2A2A"/>

    <rect x="190" y="96" width="132" height="180" fill="#000000"/>

    <!-- Horizontal Acoustic Louvers -->
    <g fill="#FFFFFF">
      <rect x="204" y="112" width="104" height="8"/>
      <rect x="204" y="128" width="104" height="8"/>
      <rect x="204" y="144" width="104" height="8"/>
      <rect x="204" y="160" width="104" height="8"/>
      <rect x="204" y="176" width="104" height="8"/>
      <rect x="204" y="192" width="104" height="8"/>
    </g>

    <!-- Red Shockmount Clamp ('A' Crossbar) -->
    <rect x="146" y="206" width="220" height="20" fill="#000000"/>
    <rect x="154" y="212" width="204" height="8" fill="#FF2A2A"/>

    <!-- Dynamic Diaphragm Core -->
    <circle cx="256" cy="254" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="256" cy="254" r="14" fill="#FF2A2A"/>
    <circle cx="256" cy="254" r="5" fill="#FFD166"/>

    <!-- Lower Body & XLR Mount -->
    <polygon points="206,280 306,280 284,346 228,346" fill="#000000"/>
    <circle cx="256" cy="390" r="14" fill="#000000"/>
    <rect x="238" y="416" width="36" height="14" fill="#000000"/>
  </g>
</svg>
