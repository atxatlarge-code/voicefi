<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Stark White Canvas -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Minimalist Frame -->
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#EAEAEA" stroke-width="1.5"/>

  <!-- Technical Header -->
  <text x="52" y="58" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">HYBRID 03 // ARCHITECTURAL PURIST</text>
  <rect x="274" y="48" width="52" height="14" fill="#000000"/>
  <text x="300" y="59" fill="#D4FF00" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" text-anchor="middle" letter-spacing="1">PURIST</text>
  <text x="460" y="58" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">VOICEGENCY</text>

  <!-- THE ARCHITECTURAL STUDIO MIC + V/A HYBRID -->
  <g id="architecturalMicVA3" transform="translate(0, 16)">
    
    <!-- Top Acoustic Grille Slats (Studio Cap) -->
    <rect x="210" y="66" width="92" height="10" fill="#000000"/>
    <rect x="226" y="82" width="60" height="8" fill="#D4FF00"/>
    <rect x="238" y="96" width="36" height="6" fill="#000000"/>

    <!-- THE 'V' BODY / TAPERED STUDIO HOUSING (Solid Pitch Black Slabs) -->
    <!-- Left V Pillar -->
    <polygon points="120,114 186,114 256,350 220,350" fill="#000000"/>
    <!-- Right V Pillar -->
    <polygon points="392,114 326,114 256,350 292,350" fill="#000000"/>

    <!-- THE 'A' CROSSBAR (Studio Capsule Clamp) -->
    <!-- Bold horizontal bar spanning across the V, forming the A crossbar & diaphragm support -->
    <rect x="180" y="218" width="152" height="16" fill="#000000"/>
    <rect x="190" y="222" width="132" height="8" fill="#D4FF00"/>

    <!-- Internal Studio Acoustic Diaphragm (Upper Chamber Core) -->
    <!-- Perfectly centered inside the V/A upper triangle -->
    <circle cx="256" cy="156" r="30" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
    <circle cx="256" cy="156" r="18" fill="#D4FF00" stroke="#000000" stroke-width="3"/>
    <circle cx="256" cy="156" r="6" fill="#000000"/>

    <!-- Lower Acoustic Pickup Node (Vocal Origin) -->
    <circle cx="256" cy="382" r="16" fill="#D4FF00" stroke="#000000" stroke-width="3"/>
    <circle cx="256" cy="382" r="28" fill="none" stroke="#000000" stroke-width="2.5"/>

    <!-- Base Mount (XLR Ground) -->
    <rect x="236" y="424" width="40" height="10" fill="#000000"/>
  </g>

  <!-- Technical Footer -->
  <text x="52" y="462" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">UNCLUTTERED PURIST GEOMETRY</text>
  <text x="460" y="462" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="end">MAX 16PX CLARITY</text>
</svg>
