<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Transparent Standalone Mark -->
  <g id="voicegencyMark" transform="translate(0, 10)">
    <!-- Top Capsule Arch (Studio Mic Dome) -->
    <path d="M 196 80 C 196 36, 316 36, 316 80" fill="none" stroke="#000000" stroke-width="22" stroke-linecap="square"/>

    <!-- THE BIG 'V' (Two Solid Black Monolithic Blades) -->
    <polygon points="120,100 186,100 256,356 220,356" fill="#000000"/>
    <polygon points="392,100 326,100 256,356 292,356" fill="#000000"/>

    <!-- THE 'A' CROSSBAR (Studio Recording Red Tally Clamp) -->
    <rect x="160" y="196" width="192" height="20" fill="#FF2A2A"/>

    <!-- Acoustic Diaphragm Core Node -->
    <circle cx="256" cy="134" r="22" fill="#000000"/>
    <circle cx="256" cy="134" r="8" fill="#FF2A2A"/>

    <!-- Base Mount Notch -->
    <rect x="238" y="390" width="36" height="14" fill="#000000"/>
  </g>
</svg>
