<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Void Canvas -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Brutalist Outer Framing -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#222222" stroke-width="2"/>
  
  <!-- Technical Grid Dividers -->
  <line x1="720" y1="24" x2="720" y2="606" stroke="#222222" stroke-width="2"/>
  <line x1="24" y1="460" x2="720" y2="460" stroke="#222222" stroke-width="2"/>

  <!-- Top Left Stamp -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="130" height="24" fill="#D4FF00"/>
    <text x="65" y="16" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="2" text-anchor="middle">VOICEGENCY</text>
    <text x="145" y="16" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">VERSION 2.0 // MACOS &amp; AGENTS</text>
  </g>

  <!-- Left Main Hero Headline -->
  <g transform="translate(60, 145)">
    <!-- Massive Impact Typography -->
    <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, 'Helvetica Neue', 'Neue Haas Grotesk', 'Inter', sans-serif" font-weight="900" font-size="52" letter-spacing="-0.04em">
      GIVE A VOICE TO
    </text>
    <text x="0" y="58" fill="#FFFFFF" font-family="-apple-system, 'Helvetica Neue', 'Neue Haas Grotesk', 'Inter', sans-serif" font-weight="900" font-size="52" letter-spacing="-0.04em">
      YOUR AGENTS.
    </text>

    <text x="0" y="126" fill="#D4FF00" font-family="-apple-system, 'Helvetica Neue', 'Neue Haas Grotesk', 'Inter', sans-serif" font-weight="900" font-size="52" letter-spacing="-0.04em">
      AND AGENCY TO
    </text>
    <text x="0" y="184" fill="#D4FF00" font-family="-apple-system, 'Helvetica Neue', 'Neue Haas Grotesk', 'Inter', sans-serif" font-weight="900" font-size="52" letter-spacing="-0.04em">
      YOUR VOICE.
    </text>

    <!-- Sub-Statement -->
    <text x="0" y="240" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" letter-spacing="0.02em">
      THE ZERO-CLICK AMBIENT VOICE LAYER FOR AUTONOMOUS COMPUTING.
    </text>
  </g>

  <!-- Bottom Left Manifesto Block -->
  <g transform="translate(60, 490)">
    <text x="0" y="22" fill="#FFFFFF" font-family="Georgia, serif" font-style="italic" font-size="15" letter-spacing="-0.01em">
      “Download Voicegency and be free to speak your movement.”
    </text>
    <text x="0" y="48" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
      U.S. PATENT APP. NO. 64/137,300 • LIENLOGIC DATA LLC • VOICEGENCY.COM
    </text>
  </g>

  <!-- Right Panel: Kinetic V-Impulse Monolith Centerpiece -->
  <g transform="translate(740, 24)">
    
    <!-- Background Technical Grid inside Right Panel -->
    <g stroke="#181818" stroke-width="1">
      <line x1="0" y1="145" x2="436" y2="145"/>
      <line x1="0" y1="290" x2="436" y2="290"/>
      <line x1="0" y1="435" x2="436" y2="435"/>
      <line x1="218" y1="0" x2="218" y2="582"/>
    </g>

    <!-- Header Right Metadata -->
    <text x="396" y="40" fill="#D4FF00" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="end" letter-spacing="2">SPEC: C1-MONOLITH</text>
    <rect x="20" y="30" width="8" height="8" fill="#D4FF00"/>
    <text x="36" y="38" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">ACOUSTIC STRIKE</text>

    <!-- The Kinetic Monolith Symbol Centered -->
    <g transform="translate(18, 55) scale(0.78)">
      <!-- Heavy Outer Kinetic V Slab (White) -->
      <polygon points="76,108 172,108 256,336 216,336" fill="#FFFFFF"/>
      <polygon points="436,108 340,108 256,336 296,336" fill="#FFFFFF"/>

      <!-- Soundwave Impulse Bars (Acid Volt) -->
      <rect x="238" y="96" width="36" height="18" fill="#D4FF00"/>
      <rect x="226" y="126" width="60" height="18" fill="#D4FF00"/>
      <rect x="214" y="156" width="84" height="18" fill="#D4FF00"/>
      <rect x="202" y="186" width="108" height="18" fill="#D4FF00"/>
      <rect x="220" y="216" width="72" height="18" fill="#D4FF00"/>
      <rect x="238" y="246" width="36" height="18" fill="#D4FF00"/>

      <!-- Apex Strike -->
      <polygon points="256,396 200,320 312,320" fill="#D4FF00"/>

      <!-- Base Ground Notch -->
      <rect x="246" y="416" width="20" height="20" fill="#FFFFFF"/>
    </g>

    <!-- Bottom Features Tagged -->
    <g transform="translate(30, 480)">
      <rect x="0" y="0" width="376" height="42" fill="#0d0d0d" stroke="#262626" stroke-width="1"/>
      <text x="16" y="26" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">01. PHONE PWA</text>
      <text x="136" y="26" fill="#D4FF00" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">02. AUTO-VAD</text>
      <text x="256" y="26" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">03. LOCAL STT</text>
    </g>
  </g>
</svg>
