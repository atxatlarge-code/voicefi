<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Fusion: 🎙️ Mic Holder + 🛜 Wi-Fi Symbol = VoiceFi -->
  <defs>
    <linearGradient id="fusionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="fusionGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="#0B1322" stroke="#1E293B" stroke-width="2" />

  <!-- 1. The Wi-Fi Symbol (Acting as the Microphone Capsule) -->
  <g transform="translate(0, -8)">
    <path d="M 68 85 A 85 85 0 0 1 188 85" fill="none" stroke="url(#fusionGrad)" stroke-width="11" stroke-linecap="round" filter="url(#fusionGlow)" />
    <path d="M 88 112 A 56 56 0 0 1 168 112" fill="none" stroke="url(#fusionGrad)" stroke-width="10" stroke-linecap="round" />
    <path d="M 108 139 A 28 28 0 0 1 148 139" fill="none" stroke="url(#fusionGrad)" stroke-width="9" stroke-linecap="round" />
    
    <!-- Central Audio Frequency Pulse / Diaphragm -->
    <line x1="128" y1="120" x2="128" y2="164" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" filter="url(#fusionGlow)" />
    <circle cx="128" cy="168" r="5" fill="#38BDF8" />

    <!-- 2. The Studio Microphone U-Bracket / Stand (Holding the Wi-Fi) -->
    <path d="M 54 105 C 54 175, 85 198, 128 198 C 171 198, 202 175, 202 105" 
          fill="none" 
          stroke="#E2E8F0" 
          stroke-width="7" 
          stroke-linecap="round" />

    <!-- Mount Pivot Screws -->
    <circle cx="54" cy="105" r="4.5" fill="#0B1322" stroke="#38BDF8" stroke-width="2" />
    <circle cx="202" cy="105" r="4.5" fill="#0B1322" stroke="#38BDF8" stroke-width="2" />

    <!-- Stem & Base -->
    <line x1="128" y1="198" x2="128" y2="226" stroke="#E2E8F0" stroke-width="7.5" stroke-linecap="round" />
    <line x1="98" y1="226" x2="158" y2="226" stroke="#E2E8F0" stroke-width="7.5" stroke-linecap="round" />
  </g>
</svg>
