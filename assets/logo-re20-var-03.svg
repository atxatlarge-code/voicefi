<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure White Canvas -->
  <rect width="512" height="512" fill="#FFFFFF"/>
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#EAEAEA" stroke-width="1.5"/>
  <text x="52" y="58" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">VAR.03 // ANGULAR STUDIO</text>
  <rect x="250" y="48" width="80" height="14" fill="#FF2A2A"/>
  <text x="290" y="59" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" text-anchor="middle">● ON AIR</text>
  <text x="460" y="58" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">VOICEGENCY</text>

  <!-- THE MARK: 03 ANGULAR STUDIO -->
  <g id="var03" transform="translate(0, 10)">
    <!-- Chamfered Angular Yoke (Sharp V) -->
    <polygon points="104,140 144,140 144,220 228,374 192,374 104,220" fill="#000000"/>
    <polygon points="408,140 368,140 368,220 284,374 320,374 408,220" fill="#000000"/>

    <!-- Yoke Corner Notches -->
    <rect x="94" y="198" width="10" height="24" fill="#000000"/>
    <rect x="408" y="198" width="10" height="24" fill="#000000"/>

    <!-- Upper Pop Filter & Capsule Dome -->
    <path d="M 194 92 C 194 48, 318 48, 318 92 Z" fill="#000000"/>
    <!-- Vertical Pop Filter Mesh Louvers -->
    <g fill="#FFFFFF">
      <rect x="220" y="60" width="6" height="26"/>
      <rect x="234" y="56" width="6" height="30"/>
      <rect x="248" y="54" width="6" height="32"/>
      <rect x="262" y="54" width="6" height="32"/>
      <rect x="276" y="56" width="6" height="30"/>
      <rect x="290" y="60" width="6" height="26"/>
    </g>

    <!-- Lower Variable-D Chamber -->
    <rect x="194" y="96" width="124" height="180" fill="#000000"/>

    <!-- Horizontal Acoustic Louvers -->
    <g fill="#FFFFFF">
      <rect x="208" y="112" width="96" height="8"/>
      <rect x="208" y="130" width="96" height="8"/>
      <rect x="208" y="148" width="96" height="8"/>
      <rect x="208" y="166" width="96" height="8"/>
      <rect x="208" y="184" width="96" height="8"/>
    </g>

    <!-- Shockmount Clamp ('A' Crossbar) -->
    <rect x="156" y="202" width="200" height="20" fill="#000000"/>
    <rect x="164" y="208" width="184" height="8" fill="#FF2A2A"/>

    <!-- Live Red Core -->
    <circle cx="256" cy="248" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="256" cy="248" r="14" fill="#FF2A2A"/>
    <circle cx="256" cy="248" r="5" fill="#FFD166"/>

    <!-- Base XLR Mount -->
    <polygon points="208,276 304,276 284,346 228,346" fill="#000000"/>
    <circle cx="256" cy="392" r="14" fill="#000000"/>
    <rect x="238" y="416" width="36" height="14" fill="#000000"/>
  </g>
</svg>
