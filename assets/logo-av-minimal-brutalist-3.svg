<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Void Black Canvas -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Minimal Frame -->
  <rect x="32" y="32" width="448" height="448" fill="none" stroke="#222222" stroke-width="1.5"/>

  <!-- Top Metadata -->
  <text x="48" y="56" fill="#D4FF00" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">SPEC 03 // NEGATIVE CUT</text>
  <text x="464" y="56" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">SOLID GEOMETRY</text>

  <!-- THE AV SOLID CONDENSER MARK -->
  <g id="solidNegativeMark" transform="translate(0, 10)">
    
    <!-- Top Acoustic Grille Cap (Acid Volt) -->
    <path d="M 210 100 C 210 70, 302 70, 302 100 Z" fill="#D4FF00"/>
    <rect x="236" y="112" width="40" height="6" fill="#D4FF00"/>

    <!-- THE 'V' BODY (Solid White Monolith) -->
    <polygon points="108,128 180,128 256,350 216,350" fill="#FFFFFF"/>
    <polygon points="404,128 332,128 256,350 296,350" fill="#FFFFFF"/>

    <!-- THE 'A' NESTED CHEVRON (Solid Acid Volt) -->
    <polygon points="256,134 316,270 256,236 196,270" fill="#D4FF00"/>

    <!-- 'A' Negative Space Horizontal Slit (Cuts cleanly across) -->
    <rect x="180" y="246" width="152" height="12" fill="#000000"/>
    <!-- The 'A' Solid Lower Bar (White) -->
    <rect x="194" y="268" width="124" height="14" fill="#FFFFFF"/>

    <!-- Microphone Capsule Grille Negative Notches (Left & Right) -->
    <polygon points="140,160 168,160 152,192 124,192" fill="#000000"/>
    <polygon points="156,200 184,200 168,232 140,232" fill="#000000"/>
    
    <polygon points="372,160 344,160 360,192 388,192" fill="#000000"/>
    <polygon points="356,200 328,200 344,232 372,232" fill="#000000"/>

    <!-- Bottom Capsule Diaphragm (Pure Acid Volt Diamond) -->
    <polygon points="256,380 276,400 256,420 236,400" fill="#D4FF00"/>
    <rect x="244" y="432" width="24" height="12" fill="#FFFFFF"/>
  </g>

  <!-- Technical Footer -->
  <text x="48" y="464" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">HIGH-CONTRAST VECTOR</text>
  <text x="464" y="464" fill="#D4FF00" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="end">VOICEGENCY 2.0</text>
</svg>
