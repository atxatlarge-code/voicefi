<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Refinement A: Hyper-Clean Geometric Minimalist -->
  <defs>
    <linearGradient id="refABg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>
    <linearGradient id="refASignal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="refAGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#refABg)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#1E293B" stroke-width="2" />

  <g transform="translate(0, 20)">
    <!-- Wi-Fi Broadcast Arcs -->
    <path d="M 148 165 A 130 130 0 0 1 364 165" fill="none" stroke="url(#refASignal)" stroke-width="18" stroke-linecap="round" filter="url(#refAGlow)" />
    <path d="M 182 205 A 88 88 0 0 1 330 205" fill="none" stroke="url(#refASignal)" stroke-width="17" stroke-linecap="round" />
    <path d="M 216 245 A 46 46 0 0 1 296 245" fill="none" stroke="url(#refASignal)" stroke-width="16" stroke-linecap="round" />

    <!-- Center Pulse Core -->
    <line x1="256" y1="210" x2="256" y2="315" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" filter="url(#refAGlow)" />
    <circle cx="256" cy="330" r="8" fill="#38BDF8" />

    <!-- Pure Minimalist Studio U-Cradle -->
    <path d="M 120 195 C 120 325, 175 365, 256 365 C 337 365, 392 325, 392 195" 
          fill="none" 
          stroke="#F8FAFC" 
          stroke-width="12" 
          stroke-linecap="round" />

    <circle cx="120" cy="195" r="7" fill="#38BDF8" />
    <circle cx="392" cy="195" r="7" fill="#38BDF8" />

    <line x1="256" y1="365" x2="256" y2="415" stroke="#F8FAFC" stroke-width="12" stroke-linecap="round" />
    <line x1="190" y1="415" x2="322" y2="415" stroke="#F8FAFC" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
