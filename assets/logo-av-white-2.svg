<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Stark White Canvas -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Minimalist Structural Box -->
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#E5E5E5" stroke-width="1.5"/>

  <!-- Technical Header -->
  <text x="52" y="58" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">AV.MIC // SPEC 02</text>
  <rect x="210" y="48" width="92" height="14" fill="#000000"/>
  <text x="256" y="59" fill="#D4FF00" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" text-anchor="middle" letter-spacing="1">STENCIL BLACK</text>
  <text x="460" y="58" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">SWISS PRINT</text>

  <!-- THE AV STENCIL CONDENSER (Solid Black & Acid Volt) -->
  <g id="avWhiteStencil" transform="translate(0, 10)">
    
    <!-- Top Rounded Condenser Cap (Acid Volt Dome with Black Slits) -->
    <path d="M 204 116 C 204 74, 308 74, 308 116" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="square"/>
    <line x1="228" y1="98" x2="284" y2="98" stroke="#D4FF00" stroke-width="8"/>

    <!-- THE 'V' (Voice & Microphone Body) - Solid Pitch Black Slabs -->
    <polygon points="120,126 182,126 256,336 224,336" fill="#000000"/>
    <polygon points="392,126 330,126 256,336 288,336" fill="#000000"/>

    <!-- Horizontal Acoustic Slits (Cutouts) -->
    <g fill="#FFFFFF">
      <rect x="144" y="156" width="30" height="8"/>
      <rect x="160" y="184" width="30" height="8"/>
      <rect x="176" y="212" width="30" height="8"/>
      
      <rect x="338" y="156" width="30" height="8"/>
      <rect x="322" y="184" width="30" height="8"/>
      <rect x="306" y="212" width="30" height="8"/>
    </g>

    <!-- THE 'A' (Agency Arrow) - Pure Solid Black Apex with Acid Volt Fill -->
    <polygon points="256,134 308,244 256,220 204,244" fill="#D4FF00" stroke="#000000" stroke-width="3"/>

    <!-- 'A' Structural Crossbar -->
    <rect x="194" y="246" width="124" height="14" fill="#000000"/>

    <!-- Central Diaphragm Core Node -->
    <circle cx="256" cy="380" r="18" fill="#000000"/>
    <circle cx="256" cy="380" r="8" fill="#D4FF00"/>
    <circle cx="256" cy="380" r="30" fill="none" stroke="#000000" stroke-width="2.5"/>

    <!-- Base Mount -->
    <rect x="236" y="426" width="40" height="8" fill="#000000"/>
  </g>

  <!-- Technical Footer -->
  <text x="52" y="462" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">PRINT GRADE // NO GLOW</text>
  <text x="460" y="462" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="end">PURE SILHOUETTE</text>
</svg>
