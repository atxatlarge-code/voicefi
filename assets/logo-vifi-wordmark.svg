<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <!-- Pure Stark White Canvas -->
  <rect width="800" height="240" fill="#FFFFFF"/>

  <!-- Left Emblem Tile -->
  <g transform="translate(36, 36)">
    <rect width="168" height="168" fill="#FAFAFA" stroke="#000000" stroke-width="2"/>
    <g transform="translate(14, 12) scale(0.72)">
      <path d="M 72 32 C 72 14, 120 14, 120 32" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="square"/>
      <polygon points="36,44 64,44 96,138 82,138" fill="#000000"/>
      <polygon points="156,44 128,44 96,138 110,138" fill="#000000"/>
      <rect x="52" y="80" width="88" height="10" fill="#FF2A2A"/>
      <circle cx="96" cy="56" r="10" fill="#000000"/>
      <circle cx="96" cy="56" r="4" fill="#FF2A2A"/>
      <rect x="88" y="152" width="16" height="8" fill="#000000"/>
    </g>
    <rect x="144" y="12" width="12" height="12" fill="#FF2A2A" stroke="#000000" stroke-width="1"/>
  </g>

  <!-- Typography Right Column -->
  <g transform="translate(236, 42)">
    <g transform="translate(0, 14)">
      <rect x="0" y="-12" width="92" height="20" fill="#FF2A2A"/>
      <text x="46" y="2" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" letter-spacing="1.5" text-anchor="middle">● ON AIR</text>
      <text x="106" y="2" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1">CLI INSTALL SPEC</text>
    </g>

    <!-- Main Bold CLI Wordmark -->
    <text x="0" y="86" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Neue Haas Grotesk', 'Inter', sans-serif" font-weight="900" font-size="64" letter-spacing="-0.04em">
      VIFI<tspan fill="#FF2A2A" font-weight="900" font-size="44" dy="-14">.SH</tspan>
    </text>

    <!-- Quick Install Command Block -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="480" height="34" fill="#000000" rx="3"/>
      <text x="16" y="22" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="700">
        <tspan fill="#FF2A2A">$</tspan> curl -fsSL https://vifi.sh | sh
      </text>
    </g>

    <!-- Descriptor Subtitle -->
    <text x="0" y="162" fill="#737373" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.04em">
      OFFICIAL CLI CLIENT FOR VOICEFI.ORG // AGENT AMBIENT VOICE
    </text>
  </g>
</svg>
