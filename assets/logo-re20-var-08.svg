<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure White Canvas -->
  <rect width="512" height="512" fill="#FFFFFF"/>
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#EAEAEA" stroke-width="1.5"/>
  <text x="52" y="58" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">VAR.08 // DUAL CHAMBER</text>
  <rect x="250" y="48" width="80" height="14" fill="#FF2A2A"/>
  <text x="290" y="59" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" text-anchor="middle">● ON AIR</text>
  <text x="460" y="58" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">VOICEGENCY</text>

  <!-- THE MARK: 08 DUAL CHAMBER -->
  <g id="var08" transform="translate(0, 10)">
    <!-- Yoke Arms (V) -->
    <polygon points="108,136 148,136 226,370 190,370" fill="#000000"/>
    <polygon points="404,136 364,136 286,370 322,370" fill="#000000"/>

    <!-- Yoke Knobs -->
    <rect x="98" y="198" width="12" height="28" fill="#000000"/>
    <rect x="402" y="198" width="12" height="28" fill="#000000"/>

    <!-- Upper Pop-Filter Chamber (Separated Dome) -->
    <path d="M 194 94 C 194 48, 318 48, 318 94 Z" fill="#000000"/>
    <rect x="212" y="70" width="88" height="8" fill="#FF2A2A"/>
    
    <!-- Fine Mesh Slits in Upper Dome -->
    <g fill="#FFFFFF">
      <circle cx="236" cy="80" r="3"/>
      <circle cx="256" cy="80" r="3"/>
      <circle cx="276" cy="80" r="3"/>
    </g>

    <!-- Lower Variable-D Cylinder -->
    <rect x="194" y="104" width="124" height="172" fill="#000000"/>

    <!-- Acoustic Louvers -->
    <g fill="#FFFFFF">
      <rect x="208" y="118" width="96" height="8"/>
      <rect x="208" y="134" width="96" height="8"/>
      <rect x="208" y="150" width="96" height="8"/>
      <rect x="208" y="166" width="96" height="8"/>
      <rect x="208" y="182" width="96" height="8"/>
    </g>

    <!-- Shockmount Clamp ('A' Crossbar) -->
    <rect x="156" y="202" width="200" height="22" fill="#000000"/>
    <rect x="164" y="208" width="184" height="10" fill="#FF2A2A"/>

    <!-- Dynamic Diaphragm Core Node -->
    <circle cx="256" cy="250" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="256" cy="250" r="14" fill="#FF2A2A"/>
    <circle cx="256" cy="250" r="5" fill="#FFD166"/>

    <!-- Lower Body & Mount -->
    <polygon points="208,280 304,280 284,346 228,346" fill="#000000"/>
    <circle cx="256" cy="390" r="14" fill="#000000"/>
    <rect x="238" y="416" width="36" height="14" fill="#000000"/>
  </g>
</svg>
