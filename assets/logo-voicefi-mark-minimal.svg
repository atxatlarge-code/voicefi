<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vfBgMin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0B1322" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Waveform Gradient -->
    <linearGradient id="waveMinGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="wifiMinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.5" />
    </linearGradient>

    <filter id="minGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#vfBgMin)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- 1. TOP: Subtle Wi-Fi Emission Waves -->
  <g transform="translate(0, 10)">
    <path d="M 170 120 A 120 120 0 0 1 342 120" fill="none" stroke="url(#wifiMinGrad)" stroke-width="7" stroke-linecap="round" />
    <path d="M 200 152 A 75 75 0 0 1 312 152" fill="none" stroke="url(#wifiMinGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M 230 184 A 35 35 0 0 1 282 184" fill="none" stroke="url(#wifiMinGrad)" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- 2. CENTER: Prominent Waveform Sculpted Microphone (Pure Acoustic Bars) -->
  <g transform="translate(0, 25)" stroke-linecap="round" filter="url(#minGlow)">
    <!-- 9 Dynamic Frequency Bars creating an unmistakable Microphone Dome -->
    <line x1="168" y1="280" x2="168" y2="330" stroke="#38BDF8" stroke-width="12" />
    <line x1="190" y1="250" x2="190" y2="360" stroke="url(#waveMinGrad)" stroke-width="12" />
    <line x1="212" y1="230" x2="212" y2="380" stroke="url(#waveMinGrad)" stroke-width="13" />
    <line x1="234" y1="210" x2="234" y2="400" stroke="url(#waveMinGrad)" stroke-width="14" />
    
    <!-- Hero Center Core (Whitest/Brightest) -->
    <line x1="256" y1="195" x2="256" y2="415" stroke="#FFFFFF" stroke-width="16" />

    <line x1="278" y1="210" x2="278" y2="400" stroke="url(#waveMinGrad)" stroke-width="14" />
    <line x1="300" y1="230" x2="300" y2="380" stroke="url(#waveMinGrad)" stroke-width="13" />
    <line x1="322" y1="250" x2="322" y2="360" stroke="url(#waveMinGrad)" stroke-width="12" />
    <line x1="344" y1="280" x2="344" y2="330" stroke="#818CF8" stroke-width="12" />
  </g>

  <!-- 3. Micro Stand Accent / Connection Node -->
  <circle cx="256" cy="460" r="5" fill="#38BDF8" filter="url(#minGlow)" />
</svg>
