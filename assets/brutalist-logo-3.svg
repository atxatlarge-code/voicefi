<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Void Canvas -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Industrial Outer Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#222222" stroke-width="2"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="#D4FF00" stroke-width="4" stroke-dasharray="16 92"/>

  <!-- Technical Cardinal Stamps -->
  <text x="256" y="24" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">NORTH // 00°</text>
  <text x="256" y="500" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">SOUTH // 180°</text>
  <text x="16" y="260" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">INBOUND</text>
  <text x="496" y="260" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">OUTBOUND</text>

  <!-- THE KINETIC APERTURE / SONIC CROSSHAIR -->
  <g id="kineticAperture">
    <!-- Heavy Crosshair Blocks (White) -->
    <rect x="244" y="64" width="24" height="96" fill="#FFFFFF"/>
    <rect x="244" y="352" width="24" height="96" fill="#FFFFFF"/>
    <rect x="64" y="244" width="96" height="24" fill="#FFFFFF"/>
    <rect x="352" y="244" width="96" height="24" fill="#FFFFFF"/>

    <!-- Concentric Oscillating Acoustic Rings (Pure Acid Volt & White) -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-dasharray="70 40"/>
    <circle cx="256" cy="256" r="95" fill="none" stroke="#D4FF00" stroke-width="16" stroke-dasharray="50 25"/>
    
    <!-- Central Agency Core / Diamond Node -->
    <polygon points="256,206 306,256 256,306 206,256" fill="#D4FF00"/>
    <polygon points="256,226 286,256 256,286 226,256" fill="#000000"/>
    <circle cx="256" cy="256" r="8" fill="#FFFFFF"/>

    <!-- 45-Degree Kinetic Blade Slices -->
    <polygon points="120,120 144,120 120,144" fill="#D4FF00"/>
    <polygon points="392,120 368,120 392,144" fill="#D4FF00"/>
    <polygon points="120,392 144,392 120,368" fill="#D4FF00"/>
    <polygon points="392,392 368,392 392,368" fill="#D4FF00"/>
  </g>

  <!-- Center Label -->
  <text x="256" y="338" fill="#D4FF00" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="3" text-anchor="middle">VOICEGENCY</text>
  <text x="256" y="356" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" letter-spacing="1.5" text-anchor="middle">AUTONOMOUS ACOUSTIC LAYER</text>
</svg>
