<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure White Canvas -->
  <rect width="512" height="512" fill="#FFFFFF"/>
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#EAEAEA" stroke-width="1.5"/>
  <text x="52" y="58" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">VAR.05 // NEGATIVE SPACE CUT</text>
  <rect x="250" y="48" width="80" height="14" fill="#FF2A2A"/>
  <text x="290" y="59" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" text-anchor="middle">● ON AIR</text>
  <text x="460" y="58" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">VOICEGENCY</text>

  <!-- THE MARK: 05 NEGATIVE SPACE CUT -->
  <g id="var05" transform="translate(0, 10)">
    <!-- Solid Monolithic Outer Block (Tapering V) -->
    <polygon points="100,120 412,120 286,380 226,380" fill="#000000"/>

    <!-- Negative Space Channel separating Yoke from Mic Body -->
    <g fill="#FFFFFF">
      <!-- Left Yoke Channel -->
      <polygon points="144,120 176,120 220,340 196,340"/>
      <!-- Right Yoke Channel -->
      <polygon points="368,120 336,120 292,340 316,340"/>
    </g>

    <!-- Top Dome Cutout -->
    <path d="M 188 94 C 188 48, 324 48, 324 94 Z" fill="#000000"/>
    <rect x="210" y="70" width="92" height="8" fill="#FF2A2A"/>

    <!-- Horizontal Acoustic Louvers (White Cuts in Central Core) -->
    <g fill="#FFFFFF">
      <rect x="194" y="112" width="124" height="8" rx="2"/>
      <rect x="194" y="128" width="124" height="8" rx="2"/>
      <rect x="194" y="144" width="124" height="8" rx="2"/>
      <rect x="194" y="160" width="124" height="8" rx="2"/>
      <rect x="194" y="176" width="124" height="8" rx="2"/>
      <rect x="194" y="192" width="124" height="8" rx="2"/>
    </g>

    <!-- The Red 'A' Crossbar Notch -->
    <rect x="176" y="208" width="160" height="14" fill="#FF2A2A"/>

    <!-- Diaphragm Core -->
    <circle cx="256" cy="254" r="22" fill="#FFFFFF"/>
    <circle cx="256" cy="254" r="14" fill="#FF2A2A"/>
    <circle cx="256" cy="254" r="5" fill="#FFD166"/>

    <!-- Lower Mount -->
    <circle cx="256" cy="402" r="12" fill="#000000"/>
    <rect x="238" y="424" width="36" height="14" fill="#000000"/>
  </g>
</svg>
