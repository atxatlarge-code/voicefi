<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!-- Minimal Monochrome macOS Menu Bar Template: Concept B Face in Mic with Wi-Fi Visor -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Clean Wi-Fi Hat -->
    <path d="M 5 4.5 A 8.5 8.5 0 0 1 17 4.5" stroke-width="1.3" />
    <path d="M 7.5 7 A 5 5 0 0 1 14.5 7" stroke-width="1.3" />
    <path d="M 9.5 9.5 A 2 2 0 0 1 12.5 9.5" stroke-width="1.3" />

    <!-- Cyber Slit Eyes -->
    <line x1="8" y1="12" x2="9.5" y2="12" stroke-width="1.3" />
    <line x1="12.5" y1="12" x2="14" y2="12" stroke-width="1.3" />

    <!-- USB-C Pill Nose -->
    <rect x="10" y="13" width="2" height="1.2" rx="0.6" stroke-width="1" />

    <!-- Smile Arc -->
    <path d="M 9.5 15 Q 11 16 12.5 15" stroke-width="1" />

    <!-- Studio Cradle / Collar & Stand -->
    <path d="M 4.5 9.5 C 4.5 16, 7 17.5, 11 17.5 C 15 17.5, 17.5 16, 17.5 9.5" stroke-width="1.3" />
    <line x1="11" y1="17.5" x2="11" y2="20" stroke-width="1.4" />
    <line x1="8.5" y1="20" x2="13.5" y2="20" stroke-width="1.4" />
  </g>
</svg>
