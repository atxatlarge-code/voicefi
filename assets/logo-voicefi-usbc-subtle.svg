<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Concept B Variation: Ultra-Subtle Minimalist USB-C Pill -->
  <defs>
    <linearGradient id="subtleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#080F1D" />
      <stop offset="100%" stop-color="#020307" />
    </linearGradient>
    <linearGradient id="subtleCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#subtleBg)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#1E293B" stroke-width="2" />

  <g transform="translate(0, 15)">
    <!-- 1. Clean Wi-Fi Hat (No Top Dot) -->
    <g filter="url(#subtleGlow)">
      <path d="M 152 145 A 120 120 0 0 1 360 145" fill="none" stroke="url(#subtleCap)" stroke-width="18" stroke-linecap="round" />
      <path d="M 184 180 A 80 80 0 0 1 328 180" fill="none" stroke="url(#subtleCap)" stroke-width="17" stroke-linecap="round" />
      <path d="M 216 215 A 42 42 0 0 1 296 215" fill="none" stroke="url(#subtleCap)" stroke-width="16" stroke-linecap="round" />
    </g>

    <!-- 2. Cyber Slit Eyes -->
    <g filter="url(#subtleGlow)">
      <line x1="202" y1="262" x2="234" y2="262" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />
      <line x1="278" y1="262" x2="310" y2="262" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />
    </g>

    <!-- 3. Minimalist USB-C Rounded Pill Slot -->
    <rect x="242" y="278" width="28" height="13" rx="6.5" fill="#38BDF8" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="2" filter="url(#subtleGlow)" />
    <line x1="248" y1="284.5" x2="264" y2="284.5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" filter="url(#subtleGlow)" />

    <!-- Waveform Smile -->
    <path d="M 230 320 Q 256 342 282 320" fill="none" stroke="#6366F1" stroke-width="5" stroke-linecap="round" filter="url(#subtleGlow)" />

    <!-- 4. Studio Cradle & Plug Base -->
    <path d="M 124 220 C 124 350, 175 385, 256 385 C 337 385, 388 350, 388 220" fill="none" stroke="#F8FAFC" stroke-width="12" stroke-linecap="round" />
    <rect x="110" y="205" width="28" height="30" rx="6" fill="#09101F" stroke="#38BDF8" stroke-width="3" />
    <rect x="374" y="205" width="28" height="30" rx="6" fill="#09101F" stroke="#38BDF8" stroke-width="3" />
    <line x1="256" y1="385" x2="256" y2="430" stroke="#F8FAFC" stroke-width="13" stroke-linecap="round" />
    <line x1="190" y1="430" x2="322" y2="430" stroke="#F8FAFC" stroke-width="13" stroke-linecap="round" />
    <circle cx="256" cy="430" r="3.5" fill="#38BDF8" filter="url(#subtleGlow)" />
  </g>
</svg>
