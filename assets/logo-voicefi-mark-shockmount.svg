<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="smBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#080E1B" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <linearGradient id="smWifiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="smWaveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <filter id="smGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#smBg)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#1E293B" stroke-width="2" />

  <g transform="translate(0, 15)">
    <!-- 1. WI-FI SIGNAL ARCS AS MIC HEAD -->
    <path d="M 140 150 A 145 145 0 0 1 372 150" fill="none" stroke="url(#smWifiGrad)" stroke-width="20" stroke-linecap="round" filter="url(#smGlow)" />
    <path d="M 178 195 A 98 98 0 0 1 334 195" fill="none" stroke="url(#smWifiGrad)" stroke-width="18" stroke-linecap="round" />
    <path d="M 216 240 A 50 50 0 0 1 296 240" fill="none" stroke="url(#smWifiGrad)" stroke-width="16" stroke-linecap="round" />

    <!-- Central Audio Frequency Pulse -->
    <g stroke-linecap="round" filter="url(#smGlow)">
      <line x1="205" y1="260" x2="205" y2="300" stroke="#38BDF8" stroke-width="10" />
      <line x1="230" y1="235" x2="230" y2="315" stroke="url(#smWaveGrad)" stroke-width="12" />
      <line x1="256" y1="205" x2="256" y2="330" stroke="#FFFFFF" stroke-width="15" />
      <line x1="282" y1="235" x2="282" y2="315" stroke="url(#smWaveGrad)" stroke-width="12" />
      <line x1="307" y1="260" x2="307" y2="300" stroke="#818CF8" stroke-width="10" />
    </g>

    <!-- Wi-Fi Base Dot / Transmitter Node -->
    <circle cx="256" cy="336" r="8" fill="#38BDF8" filter="url(#smGlow)" />

    <!-- 2. STUDIO SHOCKMOUNT SUSPENSION BANDS (Holding Wi-Fi in place) -->
    <g stroke="#38BDF8" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="3 3">
      <line x1="140" y1="230" x2="216" y2="240" />
      <line x1="372" y1="230" x2="296" y2="240" />
      <line x1="160" y1="300" x2="230" y2="315" />
      <line x1="352" y1="300" x2="282" y2="315" />
    </g>

    <!-- 3. STUDIO CONDENSER U-CRADLE -->
    <path d="M 116 210 C 116 345, 175 385, 256 385 C 337 385, 396 345, 396 210" 
          fill="none" 
          stroke="#475569" 
          stroke-width="13" 
          stroke-linecap="round" />

    <!-- Pivot Knobs -->
    <circle cx="116" cy="210" r="10" fill="#0F172A" stroke="#64748B" stroke-width="3" />
    <circle cx="116" cy="210" r="4" fill="#38BDF8" />
    <circle cx="396" cy="210" r="10" fill="#0F172A" stroke="#64748B" stroke-width="3" />
    <circle cx="396" cy="210" r="4" fill="#38BDF8" />

    <!-- Heavy Cast Metal Desktop Stand -->
    <line x1="256" y1="385" x2="256" y2="430" stroke="#475569" stroke-width="15" stroke-linecap="round" />
    <line x1="190" y1="430" x2="322" y2="430" stroke="#64748B" stroke-width="15" stroke-linecap="round" />
    <circle cx="256" cy="430" r="4" fill="#38BDF8" filter="url(#smGlow)" />
  </g>
</svg>
