<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure White Canvas -->
  <rect width="512" height="512" fill="#FFFFFF"/>
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#EAEAEA" stroke-width="1.5"/>
  <text x="52" y="58" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">VAR.04 // MONOLINE STENCIL</text>
  <rect x="250" y="48" width="80" height="14" fill="#FF2A2A"/>
  <text x="290" y="59" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" text-anchor="middle">● ON AIR</text>
  <text x="460" y="58" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">VOICEGENCY</text>

  <!-- THE MARK: 04 MONOLINE STENCIL -->
  <g id="var04" transform="translate(0, 10)">
    <!-- Monoline Yoke Frame (V) -->
    <path d="M 132 150 L 132 216 L 226 376 L 256 376 L 286 376 L 380 216 L 380 150" fill="none" stroke="#000000" stroke-width="20" stroke-linecap="square" stroke-linejoin="miter"/>

    <!-- Yoke Pivot Ring Eyelets -->
    <circle cx="132" cy="216" r="20" fill="#000000"/>
    <circle cx="132" cy="216" r="8" fill="#FFFFFF"/>
    
    <circle cx="380" cy="216" r="20" fill="#000000"/>
    <circle cx="380" cy="216" r="8" fill="#FFFFFF"/>

    <!-- Inner Mic Capsule (A) -->
    <path d="M 196 96 C 196 50, 316 50, 316 96 Z" fill="#000000"/>
    <line x1="216" y1="74" x2="296" y2="74" stroke="#FF2A2A" stroke-width="8"/>

    <rect x="196" y="100" width="120" height="176" fill="#000000"/>

    <!-- Clean Monoline Louver Cuts -->
    <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="square">
      <line x1="214" y1="116" x2="298" y2="116"/>
      <line x1="214" y1="134" x2="298" y2="134"/>
      <line x1="214" y1="152" x2="298" y2="152"/>
      <line x1="214" y1="170" x2="298" y2="170"/>
      <line x1="214" y1="188" x2="298" y2="188"/>
    </g>

    <!-- Shockmount Clamp ('A' Crossbar) -->
    <rect x="154" y="206" width="204" height="20" fill="#000000"/>
    <rect x="162" y="212" width="188" height="8" fill="#FF2A2A"/>

    <!-- Diaphragm Core Node -->
    <circle cx="256" cy="252" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="256" cy="252" r="14" fill="#FF2A2A"/>
    <circle cx="256" cy="252" r="5" fill="#FFD166"/>

    <!-- Lower Mount -->
    <polygon points="208,276 304,276 284,340 228,340" fill="#000000"/>
    <rect x="238" y="414" width="36" height="16" fill="#000000"/>
  </g>
</svg>
