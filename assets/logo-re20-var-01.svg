<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure White Canvas -->
  <rect width="512" height="512" fill="#FFFFFF"/>
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#EAEAEA" stroke-width="1.5"/>
  <text x="52" y="58" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">VAR.01 // HEAVY MONOLITH</text>
  <rect x="250" y="48" width="80" height="14" fill="#FF2A2A"/>
  <text x="290" y="59" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" text-anchor="middle">● ON AIR</text>
  <text x="460" y="58" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">VOICEGENCY</text>

  <!-- THE MARK: 01 HEAVY MONOLITH YOKE -->
  <g id="var01" transform="translate(0, 10)">
    <!-- Heavy Solid Yoke Arms (V) -->
    <polygon points="96,130 148,130 228,376 186,376" fill="#000000"/>
    <polygon points="416,130 364,130 284,376 326,376" fill="#000000"/>
    
    <!-- Yoke Knobs -->
    <rect x="84" y="196" width="16" height="32" rx="3" fill="#000000"/>
    <rect x="412" y="196" width="16" height="32" rx="3" fill="#000000"/>

    <!-- Inner Mic Capsule (A) -->
    <path d="M 188 96 C 188 48, 324 48, 324 96 Z" fill="#000000"/>
    <rect x="210" y="70" width="92" height="8" fill="#FF2A2A"/>

    <rect x="188" y="100" width="136" height="180" fill="#000000"/>

    <!-- 4 Heavy Acoustic Louvers -->
    <g fill="#FFFFFF">
      <rect x="204" y="114" width="104" height="12" rx="2"/>
      <rect x="204" y="136" width="104" height="12" rx="2"/>
      <rect x="204" y="158" width="104" height="12" rx="2"/>
      <rect x="204" y="180" width="104" height="12" rx="2"/>
    </g>

    <!-- Shockmount Clamp ('A' Crossbar) -->
    <rect x="140" y="206" width="232" height="22" fill="#000000"/>
    <rect x="148" y="212" width="216" height="10" fill="#FF2A2A"/>

    <!-- Central Diaphragm Eye -->
    <circle cx="256" cy="254" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="256" cy="254" r="14" fill="#FF2A2A"/>
    <circle cx="256" cy="254" r="5" fill="#FFD166"/>

    <!-- Base XLR -->
    <polygon points="204,284 308,284 284,354 228,354" fill="#000000"/>
    <circle cx="256" cy="396" r="14" fill="#000000"/>
    <rect x="236" y="420" width="40" height="14" fill="#000000"/>
  </g>
</svg>
