<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Classic 🎙️ Studio Microphone Vector -->
  <defs>
    <linearGradient id="micGradClassic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="#0B1322" stroke="#1E293B" stroke-width="2" />
  
  <!-- Microphone Capsule Body (Pill Shape) -->
  <rect x="100" y="44" width="56" height="96" rx="28" fill="url(#micGradClassic)" />
  
  <!-- Grill Mesh Lines on Capsule -->
  <line x1="100" y1="76" x2="156" y2="76" stroke="#0B1322" stroke-width="2.5" opacity="0.6" />
  <line x1="100" y1="92" x2="156" y2="92" stroke="#0B1322" stroke-width="2.5" opacity="0.6" />
  <line x1="100" y1="108" x2="156" y2="108" stroke="#0B1322" stroke-width="2.5" opacity="0.6" />
  <line x1="128" y1="44" x2="128" y2="140" stroke="#0B1322" stroke-width="2" opacity="0.4" />

  <!-- Classic U-Cradle / Bracket -->
  <path d="M 80 92 C 80 160, 100 176, 128 176 C 156 176, 176 160, 176 92" 
        fill="none" 
        stroke="#E2E8F0" 
        stroke-width="8" 
        stroke-linecap="round" />

  <!-- Side Pivot Knobs -->
  <circle cx="80" cy="92" r="5" fill="#38BDF8" />
  <circle cx="176" cy="92" r="5" fill="#38BDF8" />

  <!-- Center Stem -->
  <line x1="128" y1="176" x2="128" y2="208" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round" />

  <!-- Desktop Base Pedestal -->
  <line x1="96" y1="208" x2="160" y2="208" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round" />
</svg>
