<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Dark Obsidian Canvas -->
    <radialGradient id="promoBg" cx="20%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="60%" stop-color="#0e0e11"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>

    <!-- Warm Gold Gradients -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="goldTitanium2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="goldShadow2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#promoBg)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="1050" cy="150" r="300" fill="#F59E0B" opacity="0.08" filter="blur(70px)"/>
  <circle cx="150" cy="500" r="260" fill="#4F46E5" opacity="0.06" filter="blur(60px)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- LEFT COLUMN: The Poem / Manifesto -->
  <g transform="translate(80, 80)">
    
    <!-- Badge -->
    <rect x="0" y="0" width="168" height="32" rx="16" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1"/>
    <text x="84" y="21" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">THE MANIFESTO</text>

    <!-- Poem Lines -->
    <text x="0" y="95" fill="#E4E4E7" font-family="Georgia, serif" font-style="italic" font-size="25" letter-spacing="-0.01em">
      “A magnum opus may be flowing through me in this moment,
    </text>
    
    <text x="0" y="145" fill="#E4E4E7" font-family="Georgia, serif" font-style="italic" font-size="25" letter-spacing="-0.01em">
      Expialidocious may be growing new trees like they golden.
    </text>
    
    <text x="0" y="195" fill="#FCD34D" font-family="Georgia, serif" font-style="italic" font-size="25" letter-spacing="-0.01em">
      Computer usage and voice translation proving they be a nuisance,
    </text>

    <!-- Payoff Punchline -->
    <text x="0" y="270" fill="url(#goldText)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-weight="800" font-size="30" letter-spacing="-0.02em">
      Download Voicegency and be free to speak your movement.”
    </text>

    <!-- Bottom App Tagline -->
    <text x="0" y="380" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="500">
      The Universal Voice Layer for AI Agents &amp; macOS Computing
    </text>
    
    <text x="0" y="412" fill="#52525B" font-family="ui-monospace, monospace" font-size="13">
      U.S. Patent Application No. 64/137,300 • LienLogic Data LLC
    </text>
  </g>

  <!-- RIGHT COLUMN: The High-End T2M Prestige Monogram -->
  <g transform="translate(820, 145)" filter="url(#cardGlow)">
    <!-- Squircle container -->
    <rect width="300" height="300" rx="68" fill="#141417" stroke="#2a2a30" stroke-width="2"/>

    <!-- T2M Monogram Scaled Inside Tile -->
    <g transform="translate(-18, -22) scale(0.66)">
      <!-- Top Crossbar of 'T' -->
      <rect x="120" y="132" width="272" height="42" rx="10" fill="url(#goldTitanium2)"/>

      <!-- Left Vertical Column of 'M' -->
      <rect x="120" y="196" width="42" height="184" rx="10" fill="url(#goldTitanium2)"/>

      <!-- Right Vertical Column of 'M' -->
      <rect x="350" y="196" width="42" height="184" rx="10" fill="url(#goldTitanium2)"/>

      <!-- Chevron Left (M leg & 2 return) -->
      <path d="M 162 380 L 256 264 L 286 300 L 210 380 Z" fill="url(#goldShadow2)"/>
      
      <!-- Main '2' Sweeping Blade -->
      <path d="M 392 174 L 392 216 L 202 380 L 162 380 L 336 216 L 336 174 Z" fill="url(#goldTitanium2)"/>

      <!-- Central Acoustic Peak -->
      <polygon points="256,236 304,300 280,300 256,268 232,300 208,300" fill="url(#goldTitanium2)"/>

      <!-- Base Grounding Bar of '2' -->
      <rect x="162" y="346" width="230" height="34" rx="8" fill="url(#goldTitanium2)"/>
    </g>
  </g>
</svg>
