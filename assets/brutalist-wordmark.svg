<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <!-- Pure Void Background -->
  <rect width="1000" height="240" fill="#000000"/>

  <!-- Left Technical Graphic Emblem -->
  <g transform="translate(36, 36)">
    <!-- Frame Box -->
    <rect width="168" height="168" fill="#0c0c0c" stroke="#262626" stroke-width="1.5"/>
    
    <!-- Mini V-Impulse Monolith in Box -->
    <polygon points="36,36 68,36 104,116 88,116" fill="#FFFFFF"/>
    <polygon points="132,36 100,36 64,116 80,116" fill="#FFFFFF"/>
    <rect x="76" y="32" width="16" height="8" fill="#D4FF00"/>
    <rect x="70" y="44" width="28" height="8" fill="#D4FF00"/>
    <rect x="64" y="56" width="40" height="8" fill="#D4FF00"/>
    <rect x="58" y="68" width="52" height="8" fill="#D4FF00"/>
    <polygon points="84,136 64,110 104,110" fill="#D4FF00"/>
    
    <!-- Coordinate Stamp Inside Box -->
    <text x="12" y="156" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">SYS.VG//01</text>
    <rect x="144" y="12" width="12" height="12" fill="#D4FF00"/>
  </g>

  <!-- Typography Right Column -->
  <g transform="translate(236, 42)">
    
    <!-- Superheader Technical Stamp -->
    <g transform="translate(0, 14)">
      <rect x="0" y="-12" width="112" height="20" fill="#D4FF00"/>
      <text x="56" y="2" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="900" letter-spacing="1.5" text-anchor="middle">PROTOCOL</text>
      
      <text x="124" y="2" fill="#777777" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1">U.S. PAT. APP. 64/137,300</text>
    </g>

    <!-- Main Bold Swiss Wordmark -->
    <text x="0" y="86" fill="#FFFFFF" font-family="-apple-system, 'Helvetica Neue', 'Neue Haas Grotesk', 'Inter', sans-serif" font-weight="900" font-size="62" letter-spacing="-0.04em">
      VOICEGENCY<tspan fill="#D4FF00">.</tspan>
    </text>

    <!-- The Master Slogan / Chiasmus in Stark Technical Monospace -->
    <text x="0" y="124" fill="#E5E5E5" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-weight="700" font-size="16" letter-spacing="-0.01em">
      GIVE A VOICE TO YOUR AGENTS<tspan fill="#D4FF00">, AND AGENCY TO YOUR VOICE.</tspan>
    </text>

    <!-- Descriptor Subtitle -->
    <text x="0" y="148" fill="#737373" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" letter-spacing="0.05em">
      UNIVERSAL AMBIENT VOICE LAYER // MACOS &amp; AUTONOMOUS AGENTS
    </text>
  </g>
</svg>
