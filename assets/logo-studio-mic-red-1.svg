<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Stark White Canvas -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Minimalist Technical Frame -->
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#EAEAEA" stroke-width="1.5"/>
  <path d="M 256 20 V 36 M 256 476 V 492 M 20 256 H 36 M 476 256 H 492" stroke="#CCCCCC" stroke-width="1.5"/>

  <!-- Technical Header -->
  <text x="52" y="58" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">HYBRID 01 // RECORDING RED</text>
  <rect x="254" y="48" width="76" height="14" fill="#FF2A2A"/>
  <text x="292" y="59" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" text-anchor="middle" letter-spacing="1">● ON AIR</text>
  <text x="460" y="58" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">VOICEGENCY</text>

  <!-- THE STUDIO MIC + V/A HYBRID (Pitch Black & Studio Recording Red) -->
  <g id="studioMicRed1" transform="translate(0, 10)">
    
    <!-- Top Microphone Grille Dome / Header -->
    <path d="M 176 100 C 176 60, 336 60, 336 100" fill="none" stroke="#000000" stroke-width="16" stroke-linecap="square"/>
    
    <!-- Top Grille Acoustic Slats (Studio Red & Subtle Gold) -->
    <line x1="204" y1="82" x2="308" y2="82" stroke="#FF2A2A" stroke-width="8"/>
    <line x1="228" y1="68" x2="284" y2="68" stroke="#000000" stroke-width="6"/>

    <!-- THE BIG 'V' BODY (Also Inverted 'A') - Solid Pitch Black Blades -->
    <polygon points="124,116 188,116 256,360 220,360" fill="#000000"/>
    <polygon points="388,116 324,116 256,360 292,360" fill="#000000"/>

    <!-- Studio Mic Acoustic Grille Slits in Upper Body (Negative Cuts) -->
    <g fill="#FFFFFF">
      <rect x="146" y="136" width="34" height="8"/>
      <rect x="160" y="158" width="34" height="8"/>
      <rect x="174" y="180" width="34" height="8"/>
      
      <rect x="332" y="136" width="34" height="8"/>
      <rect x="318" y="158" width="34" height="8"/>
      <rect x="304" y="180" width="34" height="8"/>
    </g>

    <!-- THE HORIZONTAL 'A' CROSSBAR / STUDIO RECORDING TALLY CLAMP -->
    <!-- The bold bar cuts across the V, completing the 'A' and acting as the ON-AIR indicator -->
    <rect x="180" y="210" width="152" height="18" fill="#000000"/>
    <rect x="188" y="214" width="136" height="10" fill="#FF2A2A"/>

    <!-- Internal Studio Condenser Diaphragm (Recording Core) -->
    <circle cx="256" cy="156" r="32" fill="#FFFFFF" stroke="#000000" stroke-width="5"/>
    <circle cx="256" cy="156" r="22" fill="#FF2A2A" stroke="#000000" stroke-width="3"/>
    <!-- Subtle Golden Center Resonance Node -->
    <circle cx="256" cy="156" r="8" fill="#FFD166" stroke="#000000" stroke-width="1.5"/>

    <!-- Base Pickup Core / Acoustic Origin -->
    <circle cx="256" cy="392" r="14" fill="#000000"/>
    <circle cx="256" cy="392" r="6" fill="#FF2A2A"/>

    <!-- Microphone XLR Stand Mount Notch -->
    <rect x="236" y="420" width="40" height="14" fill="#000000"/>
    <rect x="248" y="434" width="16" height="8" fill="#FF2A2A"/>
  </g>

  <!-- Technical Footer -->
  <text x="52" y="462" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">STUDIO ON-AIR RED (#FF2A2A)</text>
  <text x="460" y="462" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="end">[LIVE MIC PROTOCOL]</text>
</svg>
