<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure White Canvas -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Minimal Frame -->
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#EAEAEA" stroke-width="1.5"/>
  <text x="52" y="58" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">MINIMAL 04 // ICONIC BROADCAST</text>
  <rect x="254" y="48" width="76" height="14" fill="#FF2A2A"/>
  <text x="292" y="59" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" text-anchor="middle">● ON AIR</text>
  <text x="460" y="58" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">VOICEGENCY</text>

  <!-- THE MARK: 04 ICONIC BROADCAST (Distilled Perfection) -->
  <g id="minimal04" transform="translate(0, 16)">
    
    <!-- Top Broadcast Dome Head -->
    <path d="M 192 86 C 192 40, 320 40, 320 86 Z" fill="#000000"/>
    <rect x="216" y="62" width="80" height="8" fill="#FF2A2A"/>

    <!-- THE BIG 'V' BODY -->
    <polygon points="120,104 186,104 256,356 220,356" fill="#000000"/>
    <polygon points="392,104 326,104 256,356 292,356" fill="#000000"/>

    <!-- Just 2 Bold Variable-D Acoustic Louvers (Zero Clutter) -->
    <rect x="194" y="108" width="124" height="14" fill="#000000"/>
    <rect x="202" y="136" width="108" height="14" fill="#000000"/>

    <!-- THE 'A' CROSSBAR / RED TALLY CLAMP (Single Bold Horizontal Line) -->
    <rect x="156" y="196" width="200" height="22" fill="#000000"/>
    <rect x="164" y="202" width="184" height="10" fill="#FF2A2A"/>

    <!-- Central Diaphragm Core Node -->
    <circle cx="256" cy="254" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="256" cy="254" r="14" fill="#FF2A2A"/>
    <circle cx="256" cy="254" r="5" fill="#FFD166"/>

    <!-- Base Mount -->
    <polygon points="208,276 304,276 284,336 228,336" fill="#000000"/>
    <rect x="238" y="390" width="36" height="16" fill="#000000"/>
  </g>
</svg>
