<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <!-- Pure Stark White Canvas -->
  <rect width="1000" height="240" fill="#FFFFFF"/>

  <!-- Left Emblem Tile (Stark Black on White Frame) -->
  <g transform="translate(36, 36)">
    <!-- Box Frame -->
    <rect width="168" height="168" fill="#F8F8F8" stroke="#000000" stroke-width="2"/>
    
    <!-- Mini AV Microphone Monolith inside Tile -->
    <g transform="translate(14, 12) scale(0.72)">
      <!-- Top Grille -->
      <rect x="76" y="24" width="40" height="5" fill="#000000"/>
      <rect x="82" y="32" width="28" height="4" fill="#D4FF00"/>
      <rect x="88" y="39" width="16" height="4" fill="#000000"/>

      <!-- V Blades -->
      <polygon points="36,46 64,46 96,134 82,134" fill="#000000"/>
      <polygon points="156,46 128,46 96,134 110,134" fill="#000000"/>

      <!-- Slits -->
      <g fill="#FFFFFF">
        <polygon points="48,58 60,58 55,67 43,67"/>
        <polygon points="56,71 68,71 63,80 51,80"/>
        <polygon points="144,58 132,58 137,67 149,67"/>
        <polygon points="136,71 124,71 129,80 141,80"/>
      </g>

      <!-- A Delta -->
      <polygon points="96,50 116,92 96,82 76,92" fill="#D4FF00" stroke="#000000" stroke-width="1.5"/>
      <rect x="70" y="93" width="52" height="6" fill="#000000"/>

      <!-- Diaphragm Node -->
      <circle cx="96" cy="150" r="7" fill="#D4FF00" stroke="#000000" stroke-width="2"/>
      <circle cx="96" cy="150" r="13" fill="none" stroke="#000000" stroke-width="1.5"/>
      <rect x="88" y="168" width="16" height="4" fill="#000000"/>
    </g>

    <!-- Technical Tag in Tile -->
    <text x="12" y="156" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">SPEC.AV//01</text>
    <rect x="144" y="12" width="12" height="12" fill="#D4FF00" stroke="#000000" stroke-width="1"/>
  </g>

  <!-- Typography Right Column -->
  <g transform="translate(236, 42)">
    
    <!-- Superheader Technical Stamp -->
    <g transform="translate(0, 14)">
      <rect x="0" y="-12" width="112" height="20" fill="#000000"/>
      <text x="56" y="2" fill="#D4FF00" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="900" letter-spacing="1.5" text-anchor="middle">PROTOCOL</text>
      
      <text x="124" y="2" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1">U.S. PAT. APP. 64/137,300</text>
    </g>

    <!-- Main Bold Swiss Wordmark -->
    <text x="0" y="86" fill="#000000" font-family="-apple-system, 'Helvetica Neue', 'Neue Haas Grotesk', 'Inter', sans-serif" font-weight="900" font-size="62" letter-spacing="-0.04em">
      VOICEGENCY<tspan fill="#000000">.</tspan>
    </text>

    <!-- The Master Slogan / Chiasmus in Stark Technical Typography -->
    <text x="0" y="124" fill="#000000" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-weight="800" font-size="16.5" letter-spacing="-0.01em">
      GIVE A VOICE TO YOUR AGENTS, <tspan fill="#000000" text-decoration="underline" style="text-decoration-color: #D4FF00; text-decoration-thickness: 3px;">AND AGENCY TO YOUR VOICE.</tspan>
    </text>

    <!-- Descriptor Subtitle -->
    <text x="0" y="148" fill="#737373" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" letter-spacing="0.04em">
      UNIVERSAL AMBIENT VOICE LAYER // MACOS &amp; AUTONOMOUS AGENTS
    </text>
  </g>
</svg>
