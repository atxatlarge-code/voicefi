<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Concept C: The Clever Dual-Nature (Apple Finder / Studio Mic Pareidolia) -->
  <defs>
    <linearGradient id="charCBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060E" />
      <stop offset="50%" stop-color="#080E1B" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>

    <linearGradient id="clydeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <filter id="charCGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#charCBg)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#1E293B" stroke-width="2" />

  <g transform="translate(0, 18)">
    
    <!-- 1. WI-FI HAT / BROADCAST ANTENNA ATOP THE HEAD -->
    <g filter="url(#charCGlow)">
      <!-- Hat Crown Top Arc -->
      <path d="M 148 135 A 130 130 0 0 1 364 135" fill="none" stroke="url(#clydeGrad)" stroke-width="18" stroke-linecap="round" />
      <!-- Hat Mid Arc -->
      <path d="M 182 175 A 88 88 0 0 1 330 175" fill="none" stroke="url(#clydeGrad)" stroke-width="16" stroke-linecap="round" />
      <!-- Hat Base Brim -->
      <path d="M 216 215 A 46 46 0 0 1 296 215" fill="none" stroke="url(#clydeGrad)" stroke-width="15" stroke-linecap="round" />
    </g>

    <!-- 2. THE DUAL FACE / MICROPHONE CAPSULE -->
    <!-- Subtle Face Capsule Outline -->
    <rect x="176" y="225" width="160" height="135" rx="42" fill="#0B1322" fill-opacity="0.6" stroke="#1E293B" stroke-width="2.5" />

    <!-- Two Bright Intelligent Eyes (Dual Purpose: Eyes & Diaphragm Contacts) -->
    <g filter="url(#charCGlow)">
      <circle cx="218" cy="275" r="9" fill="#38BDF8" />
      <circle cx="294" cy="275" r="9" fill="#38BDF8" />
    </g>

    <!-- Central Waveform Nose/Pillar -->
    <line x1="256" y1="240" x2="256" y2="305" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" filter="url(#charCGlow)" />

    <!-- Subtle Waveform Smile (Audio Wave Mouth) -->
    <path d="M 226 325 Q 256 345 286 325" fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round" filter="url(#charCGlow)" />

    <!-- 3. STUDIO CRADLE / HEADPHONES / PLUG (The Jawline) -->
    <path d="M 124 215 C 124 355, 178 395, 256 395 C 334 395, 388 355, 388 215" 
          fill="none" 
          stroke="#E2E8F0" 
          stroke-width="12" 
          stroke-linecap="round" />

    <!-- Headphone Earcups / Pivot Screws -->
    <g>
      <circle cx="124" cy="215" r="9" fill="#0B1322" stroke="#38BDF8" stroke-width="3" />
      <circle cx="388" cy="215" r="9" fill="#0B1322" stroke="#38BDF8" stroke-width="3" />
    </g>

    <!-- Stem & Desktop Base -->
    <line x1="256" y1="395" x2="256" y2="435" stroke="#E2E8F0" stroke-width="13" stroke-linecap="round" />
    <line x1="192" y1="435" x2="320" y2="435" stroke="#E2E8F0" stroke-width="13" stroke-linecap="round" />
    <circle cx="256" cy="435" r="3.5" fill="#38BDF8" filter="url(#charCGlow)" />

  </g>
</svg>
