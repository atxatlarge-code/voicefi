<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure White Canvas -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Minimal Frame -->
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#EAEAEA" stroke-width="1.5"/>
  <text x="52" y="58" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">MINIMAL 02 // DUAL-PILLAR CAPSULE</text>
  <rect x="254" y="48" width="76" height="14" fill="#FF2A2A"/>
  <text x="292" y="59" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" text-anchor="middle">● ON AIR</text>
  <text x="460" y="58" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">VOICEGENCY</text>

  <!-- THE MARK: 02 DUAL-PILLAR CAPSULE -->
  <g id="minimal02" transform="translate(0, 16)">
    
    <!-- Flat Studio Cap -->
    <rect x="200" y="66" width="112" height="16" fill="#000000"/>

    <!-- THE BIG 'V' BODY (Two Clean Slabs) -->
    <polygon points="124,100 188,100 256,360 220,360" fill="#000000"/>
    <polygon points="388,100 324,100 256,360 292,360" fill="#000000"/>

    <!-- Single Horizontal Acoustic Slit (Upper Chamber) -->
    <rect x="212" y="102" width="88" height="12" fill="#000000"/>
    <rect x="224" y="128" width="64" height="10" fill="#000000"/>

    <!-- THE 'A' CROSSBAR (Solid Black Bar with Red Tally Inset) -->
    <rect x="170" y="196" width="172" height="20" fill="#000000"/>
    <rect x="178" y="202" width="156" height="8" fill="#FF2A2A"/>

    <!-- Central Acoustic Core Node -->
    <circle cx="256" cy="254" r="22" fill="#FF2A2A" stroke="#000000" stroke-width="4"/>
    <circle cx="256" cy="254" r="6" fill="#FFD166"/>

    <!-- Base Mount -->
    <rect x="238" y="394" width="36" height="16" fill="#000000"/>
  </g>
</svg>
