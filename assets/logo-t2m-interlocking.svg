<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgT2M_2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>

    <!-- Warm Gold Gradient -->
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Platinum / White Gold Accent Gradient -->
    <linearGradient id="whiteGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background App Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgT2M_2)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#2e2a27" stroke-width="2"/>

  <!-- Logo Mark: Precision Interlocking T-2-M Monogram -->
  <g transform="translate(10, 0)">
    
    <!-- Letter 'T' (Left Anchor) -->
    <!-- T Bar -->
    <path d="M 80 160 H 210" stroke="url(#goldRibbon)" stroke-width="24" stroke-linecap="round"/>
    <!-- T Stem -->
    <path d="M 145 160 V 360" stroke="url(#goldRibbon)" stroke-width="24" stroke-linecap="round"/>

    <!-- Number '2' (Center Core - Sweeping over T & weaving under M) -->
    <!-- 2 Curve & Diagonal -->
    <path d="M 205 195 C 205 145 245 125 285 125 C 330 125 365 155 365 200 C 365 245 320 290 240 360 H 370" 
          fill="none" 
          stroke="url(#whiteGold)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#softGlow)"/>

    <!-- Letter 'M' (Right Anchor - Intertwined) -->
    <path d="M 285 360 L 320 220 L 375 310 L 430 220 L 465 360" 
          fill="none" 
          stroke="url(#goldRibbon)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Voice Wave Dots Accent underneath -->
    <circle cx="215" cy="415" r="5" fill="url(#goldRibbon)"/>
    <circle cx="245" cy="415" r="7" fill="url(#whiteGold)"/>
    <circle cx="275" cy="415" r="9" fill="url(#goldRibbon)" filter="url(#softGlow)"/>
    <circle cx="305" cy="415" r="7" fill="url(#whiteGold)"/>
    <circle cx="335" cy="415" r="5" fill="url(#goldRibbon)"/>

  </g>
</svg>
