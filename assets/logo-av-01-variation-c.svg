<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Void Black Canvas -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Minimal Outer Frame -->
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#1c1c1c" stroke-width="1.5"/>

  <!-- Technical Header -->
  <text x="52" y="58" fill="#D4FF00" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">01-C // PURIST MONOLITH</text>
  <text x="460" y="58" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">MAX SILHOUETTE</text>

  <!-- THE MARK: 01-C PURIST MONOLITH -->
  <g id="mark01C" transform="translate(0, 14)">
    
    <!-- Top Acoustic Grille Slats -->
    <rect x="220" y="80" width="72" height="10" fill="#D4FF00"/>
    <rect x="232" y="98" width="48" height="8" fill="#D4FF00"/>
    <rect x="242" y="114" width="28" height="6" fill="#D4FF00"/>

    <!-- THE 'V' (Voice & Mic Body) - Pure Solid White Slabs -->
    <polygon points="120,132 186,132 256,338 222,338" fill="#FFFFFF"/>
    <polygon points="392,132 326,132 256,338 290,338" fill="#FFFFFF"/>

    <!-- THE 'A' (Agency Arrow) - Pure Solid Acid Volt Delta -->
    <polygon points="256,142 304,242 256,220 208,242" fill="#D4FF00"/>

    <!-- 'A' Structural Crossbar (Diaphragm Clamp) -->
    <rect x="194" y="244" width="124" height="14" fill="#D4FF00"/>

    <!-- Central Voice Node (Solid Pickup Diaphragm) -->
    <circle cx="256" cy="378" r="18" fill="#D4FF00"/>
    <circle cx="256" cy="378" r="30" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    
    <!-- Base XLR Mount -->
    <rect x="236" y="424" width="40" height="8" fill="#FFFFFF"/>
  </g>

  <!-- Technical Footer -->
  <text x="52" y="462" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">UNCLUTTERED</text>
  <text x="460" y="462" fill="#D4FF00" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="end">MAX 16PX CLARITY</text>
</svg>
