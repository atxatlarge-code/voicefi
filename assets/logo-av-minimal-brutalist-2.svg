<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Void Black Canvas -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Technical Border Box -->
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#222222" stroke-width="1.5"/>

  <!-- Technical Corner Stamps -->
  <text x="52" y="58" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1">SPEC 02 // LINE STENCIL</text>
  <text x="460" y="58" fill="#D4FF00" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="end" letter-spacing="2">AV.STENCIL</text>

  <!-- THE LINEAR AV MICROPHONE MARK -->
  <g id="linearStencil" transform="translate(0, -6)">
    
    <!-- Top Microphone Grille Dome (Acoustic Capsule) -->
    <path d="M 196 140 C 196 95, 316 95, 316 140" fill="none" stroke="#D4FF00" stroke-width="14" stroke-linecap="square"/>
    <line x1="226" y1="120" x2="286" y2="120" stroke="#D4FF00" stroke-width="6"/>

    <!-- The 'V' (Voice & Outer Microphone Chassis) - Heavy White Monoline -->
    <path d="M 124 140 L 256 370 L 388 140" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter"/>

    <!-- The 'A' (Agency Arrow) - Nested Acid Volt Monoline -->
    <path d="M 200 290 L 256 180 L 312 290" fill="none" stroke="#D4FF00" stroke-width="20" stroke-linecap="square" stroke-linejoin="miter"/>
    
    <!-- 'A' Crossbar (Acoustic Diaphragm Line) -->
    <line x1="172" y1="262" x2="340" y2="262" stroke="#D4FF00" stroke-width="14" stroke-linecap="square"/>

    <!-- Acoustic Sound Wave Radiation Bars (Left & Right) -->
    <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="square" opacity="0.6">
      <line x1="84" y1="180" x2="84" y2="260"/>
      <line x1="60" y1="200" x2="60" y2="240"/>
      
      <line x1="428" y1="180" x2="428" y2="260"/>
      <line x1="452" y1="200" x2="452" y2="240"/>
    </g>

    <!-- Central Node (Solid Core Dot) -->
    <rect x="246" y="394" width="20" height="20" fill="#D4FF00"/>
    <rect x="236" y="424" width="40" height="10" fill="#FFFFFF"/>
  </g>

  <!-- Technical Footer Tag -->
  <text x="52" y="460" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">PURE MONOLINE // NO GLOWS</text>
  <text x="460" y="460" fill="#D4FF00" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="end">SWISS INDUSTRIAL</text>
</svg>
