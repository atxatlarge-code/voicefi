<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <radialGradient id="bgT2M_3" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>

    <!-- Sleek Neon Amber/Gold Gradient -->
    <linearGradient id="goldPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background App Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgT2M_3)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#232329" stroke-width="2"/>

  <!-- Lowercase 't 2 m' One-Stroke Continuous Soundwave -->
  <g transform="translate(0, 15)">
    
    <!-- Audio Wave entry -->
    <path d="M 60 290 Q 75 290 85 270 L 95 240 Q 105 200 115 290 H 130" 
          fill="none" stroke="url(#goldPulse)" stroke-width="12" stroke-linecap="round"/>

    <!-- 't' letterform -->
    <!-- vertical stem with bottom hook -->
    <path d="M 160 170 V 310 C 160 340 180 345 200 335" 
          fill="none" stroke="url(#goldPulse)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 't' crossbar -->
    <path d="M 135 225 H 195" 
          stroke="url(#goldPulse)" stroke-width="15" stroke-linecap="round"/>

    <!-- Connecting bridge from t into '2' -->
    <path d="M 200 335 C 215 325 220 280 235 240 C 245 210 270 190 295 190 C 325 190 340 215 335 245 C 325 290 260 340 235 365 H 345" 
          fill="none" stroke="url(#goldPulse)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#waveGlow)"/>

    <!-- Connecting bridge from 2 into 'm' -->
    <!-- 'm' arches -->
    <path d="M 365 365 V 250 C 365 225 385 215 405 225 C 420 235 425 255 425 280 V 365" 
          fill="none" stroke="url(#goldPulse)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 425 270 C 430 235 450 215 470 225 C 485 235 490 255 490 280 V 365" 
          fill="none" stroke="url(#goldPulse)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Subtitle Branding / Tagline -->
    <text x="256" y="435" 
          text-anchor="middle" 
          fill="#A1A1AA" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" 
          font-size="18" 
          font-weight="600" 
          letter-spacing="9">TALK 2 ME</text>
  </g>
</svg>
