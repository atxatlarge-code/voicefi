<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Stark White Canvas -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Minimal Frame -->
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#EAEAEA" stroke-width="1.5"/>

  <!-- Technical Header -->
  <text x="52" y="58" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">RE20-B // LOUVER AMBIGRAM</text>
  <rect x="246" y="48" width="84" height="14" fill="#000000"/>
  <text x="288" y="59" fill="#D4FF00" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" text-anchor="middle" letter-spacing="1">VARIABLE-D</text>
  <text x="460" y="58" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">VOICEGENCY</text>

  <!-- THE RE20 ARCHITECTURAL LOUVER AMBIGRAM -->
  <g id="re20MarkB" transform="translate(0, 14)">
    
    <!-- Top Broadcast Grille Cap (Solid Black with Red Stripe) -->
    <rect x="174" y="64" width="164" height="16" rx="2" fill="#000000"/>
    <rect x="194" y="84" width="124" height="8" fill="#FF2A2A"/>

    <!-- THE HEAVY 'V' BODY CASING - Solid Black Slabs -->
    <polygon points="116,100 184,100 256,368 220,368" fill="#000000"/>
    <polygon points="396,100 328,100 256,368 292,368" fill="#000000"/>

    <!-- Stepped Horizontal Acoustic Louvers (Upper Chamber Ladder) -->
    <!-- These horizontal slats naturally draw the eye up into the 'A' apex -->
    <g fill="#000000">
      <rect x="194" y="100" width="124" height="8" rx="1"/>
      <rect x="202" y="116" width="108" height="8" rx="1"/>
      <rect x="210" y="132" width="92" height="8" rx="1"/>
      <rect x="218" y="148" width="76" height="8" rx="1"/>
      <rect x="226" y="164" width="60" height="8" rx="1"/>
      <rect x="234" y="180" width="44" height="8" rx="1"/>
    </g>

    <!-- Outer Acoustic Side Slits (White Negative Space Cuts on V Wings) -->
    <g fill="#FFFFFF">
      <polygon points="140,118 168,118 158,142 130,142"/>
      <polygon points="154,154 182,154 172,178 144,178"/>
      
      <polygon points="372,118 344,118 354,142 382,142"/>
      <polygon points="358,154 330,154 340,178 368,178"/>
    </g>

    <!-- THE SOLID 'A' CROSSBAR / RED TALLY RING -->
    <rect x="168" y="200" width="176" height="22" fill="#000000"/>
    <rect x="176" y="206" width="160" height="10" fill="#FF2A2A"/>

    <!-- Central Dynamic Diaphragm Core (Red Node with Gold Pickup Dot) -->
    <circle cx="256" cy="254" r="26" fill="#FFFFFF" stroke="#000000" stroke-width="5"/>
    <circle cx="256" cy="254" r="16" fill="#FF2A2A" stroke="#000000" stroke-width="2.5"/>
    <circle cx="256" cy="254" r="6" fill="#FFD166"/>

    <!-- Lower V Apex / XLR Ground Connector -->
    <circle cx="256" cy="392" r="14" fill="#000000"/>
    <rect x="238" y="416" width="36" height="14" fill="#000000"/>
    <line x1="256" y1="406" x2="256" y2="430" stroke="#FF2A2A" stroke-width="4"/>
  </g>

  <!-- Technical Footer -->
  <text x="52" y="462" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">STEPPED ACOUSTIC LADDER</text>
  <text x="460" y="462" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="end">ICONIC PROPORTIONS</text>
</svg>
