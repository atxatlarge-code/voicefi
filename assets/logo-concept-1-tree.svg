<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="107" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Logo Mark Group -->
  <g transform="translate(0, 10)">
    <!-- Base Waveform Line (The Voice / Pulse) -->
    <path d="M 64 340 H 130 Q 142 340 148 315 L 160 250 Q 166 220 174 250 L 186 390 Q 192 420 200 340 L 214 270 Q 220 240 228 340 H 240" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#goldGlow)"/>

    <!-- Right Waveform Extension -->
    <path d="M 272 340 H 284 Q 292 340 298 310 L 312 230 Q 318 200 326 290 L 338 410 Q 346 440 354 340 L 366 280 Q 372 250 380 340 H 448" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#goldGlow)"/>

    <!-- The Central Trunk rising out of the voice wave -->
    <path d="M 256 380 V 230" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="8" 
          stroke-linecap="round"
          filter="url(#goldGlow)"/>

    <!-- Main Branches (forming subtle speech arc / canopy) -->
    <!-- Left Lower Branch -->
    <path d="M 256 280 C 235 270 200 270 175 225" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="6" 
          stroke-linecap="round"/>
    
    <!-- Right Lower Branch -->
    <path d="M 256 280 C 277 270 312 270 337 225" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="6" 
          stroke-linecap="round"/>

    <!-- Left Upper Branch -->
    <path d="M 256 240 C 240 210 205 185 190 145" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="6" 
          stroke-linecap="round"/>

    <!-- Right Upper Branch -->
    <path d="M 256 240 C 272 210 307 185 322 145" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="6" 
          stroke-linecap="round"/>

    <!-- Top Center Fork -->
    <path d="M 256 230 C 250 180 235 150 225 110" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="5" 
          stroke-linecap="round"/>
    <path d="M 256 230 C 262 180 277 150 287 110" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="5" 
          stroke-linecap="round"/>

    <!-- Sub-branches -->
    <path d="M 205 255 C 190 240 160 245 140 210" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round"/>
    <path d="M 307 255 C 322 240 352 245 372 210" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round"/>
    
    <!-- Leaf / Idea Nodes (Golden Blossoms) -->
    <circle cx="225" cy="105" r="7" fill="url(#goldGrad)"/>
    <circle cx="287" cy="105" r="7" fill="url(#goldGrad)"/>
    <circle cx="256" cy="90"  r="9" fill="url(#goldGrad)" filter="url(#goldGlow)"/>

    <circle cx="188" cy="140" r="7" fill="url(#goldGrad)"/>
    <circle cx="324" cy="140" r="7" fill="url(#goldGrad)"/>
    
    <circle cx="173" cy="220" r="8" fill="url(#goldGrad)"/>
    <circle cx="339" cy="220" r="8" fill="url(#goldGrad)"/>
    
    <circle cx="136" cy="206" r="6.5" fill="url(#goldGrad)"/>
    <circle cx="376" cy="206" r="6.5" fill="url(#goldGrad)"/>

    <circle cx="210" cy="170" r="4.5" fill="#FCD34D" opacity="0.8"/>
    <circle cx="302" cy="170" r="4.5" fill="#FCD34D" opacity="0.8"/>
    <circle cx="256" cy="150" r="5" fill="#FCD34D" opacity="0.9"/>
  </g>
</svg>
