<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Void Black Canvas (Zero Gradients) -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Minimalist Structural Grid Marks -->
  <g stroke="#1a1a1a" stroke-width="1">
    <line x1="40" y1="40" x2="472" y2="40"/>
    <line x1="40" y1="472" x2="472" y2="472"/>
    <line x1="40" y1="40" x2="40" y2="472"/>
    <line x1="472" y1="40" x2="472" y2="472"/>
    <line x1="256" y1="20" x2="256" y2="492" stroke-dasharray="4 6"/>
  </g>

  <!-- Corner Registration Markers -->
  <path d="M 40 54 V 40 H 54 M 458 40 H 472 V 54 M 40 458 V 472 H 54 M 458 472 H 472 V 458" stroke="#D4FF00" stroke-width="2" fill="none"/>

  <!-- Technical Header Tag -->
  <text x="56" y="60" fill="#D4FF00" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="2">AV.MIC // SPEC 01</text>
  <text x="456" y="60" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1">VOICEGENCY</text>

  <!-- THE MINIMALIST AV MICROPHONE MARK (Solid Flat Geometry) -->
  <g id="avMicMark" transform="translate(0, 10)">
    
    <!-- Top Acoustic Grille Slits (Microphone Header) -->
    <rect x="220" y="86" width="72" height="10" fill="#D4FF00"/>
    <rect x="232" y="104" width="48" height="8" fill="#D4FF00"/>
    <rect x="242" y="120" width="28" height="6" fill="#D4FF00"/>

    <!-- THE 'V' (VOICE & MICROPHONE BODY) - Pure Solid White Slabs -->
    <!-- Left V Pillar -->
    <polygon points="120,138 184,138 256,340 224,340" fill="#FFFFFF"/>
    <!-- Right V Pillar -->
    <polygon points="392,138 328,138 256,340 288,340" fill="#FFFFFF"/>

    <!-- THE 'A' (AGENCY ARROW) - Pure Solid Acid Volt Chevron -->
    <!-- Ascending Agency Apex -->
    <polygon points="256,150 298,244 256,226 214,244" fill="#D4FF00"/>

    <!-- The 'A' Crossbar (Acoustic Diaphragm Anchor) -->
    <rect x="198" y="248" width="116" height="14" fill="#D4FF00"/>

    <!-- Microphone Acoustic Slit Cutouts (Negative Space in V) -->
    <rect x="156" y="166" width="24" height="6" fill="#000000"/>
    <rect x="172" y="196" width="24" height="6" fill="#000000"/>
    <rect x="188" y="226" width="24" height="6" fill="#000000"/>
    
    <rect x="332" y="166" width="24" height="6" fill="#000000"/>
    <rect x="316" y="196" width="24" height="6" fill="#000000"/>
    <rect x="300" y="226" width="24" height="6" fill="#000000"/>

    <!-- Central Diaphragm Core Node (Vocal Origin) -->
    <circle cx="256" cy="380" r="16" fill="#D4FF00"/>
    <circle cx="256" cy="380" r="28" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    
    <!-- Base Microphone Anchor (XLR Ground) -->
    <rect x="236" y="424" width="40" height="8" fill="#FFFFFF"/>
  </g>

  <!-- Technical Footer Tag -->
  <text x="56" y="460" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FLAT VECTOR // ZERO GRADIENT</text>
  <text x="456" y="460" fill="#D4FF00" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="end" letter-spacing="1">[A + V LOCKUP]</text>
</svg>
