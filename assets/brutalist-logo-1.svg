<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Void Canvas -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Structural Grid & Crosshairs (Subtle Technical) -->
  <g stroke="#1a1a1a" stroke-width="1">
    <line x1="32" y1="32" x2="480" y2="32"/>
    <line x1="32" y1="480" x2="480" y2="480"/>
    <line x1="32" y1="32" x2="32" y2="480"/>
    <line x1="480" y1="32" x2="480" y2="480"/>
    <line x1="256" y1="16" x2="256" y2="496" stroke-dasharray="4 6"/>
    <line x1="16" y1="256" x2="496" y2="256" stroke-dasharray="4 6"/>
  </g>

  <!-- Corner Registration Marks -->
  <g stroke="#D4FF00" stroke-width="2">
    <path d="M 32 44 V 32 H 44"/>
    <path d="M 468 32 H 480 V 44"/>
    <path d="M 32 468 V 480 H 44"/>
    <path d="M 468 480 H 480 V 468"/>
  </g>

  <!-- Technical Meta Stamped -->
  <text x="44" y="56" fill="#D4FF00" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">SYS.VG // MARK 01</text>
  <text x="468" y="56" fill="#555555" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1">PAT.64/137,300</text>

  <!-- THE KINETIC V-IMPULSE (Heavy Monolithic Acoustic Geometry) -->
  <g id="kineticMark">
    <!-- Heavy Outer Kinetic V Slab (White) -->
    <!-- Left Pillar / Descending Block -->
    <polygon points="76,108 172,108 256,336 216,336" fill="#FFFFFF"/>
    
    <!-- Right Pillar / Ascending Block -->
    <polygon points="436,108 340,108 256,336 296,336" fill="#FFFFFF"/>

    <!-- Acoustic Energy Slices / Impulse Waves (Pure Acid Volt Slices) -->
    <!-- Soundwave Impulse Bars cutting through the core -->
    <rect x="238" y="96" width="36" height="18" fill="#D4FF00"/>
    <rect x="226" y="126" width="60" height="18" fill="#D4FF00"/>
    <rect x="214" y="156" width="84" height="18" fill="#D4FF00"/>
    <rect x="202" y="186" width="108" height="18" fill="#D4FF00"/>
    <rect x="220" y="216" width="72" height="18" fill="#D4FF00"/>
    <rect x="238" y="246" width="36" height="18" fill="#D4FF00"/>

    <!-- The Kinetic Apex Strike / Downward Acoustic Wedge -->
    <polygon points="256,396 200,320 312,320" fill="#D4FF00"/>

    <!-- Base Acoustic Resonance Ground (Stark Solid Notch) -->
    <rect x="246" y="416" width="20" height="20" fill="#FFFFFF"/>
  </g>

  <!-- Technical Bottom Tag -->
  <text x="44" y="464" fill="#666666" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">V-IMPULSE MONOLITH</text>
  <text x="468" y="464" fill="#D4FF00" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1.5">[VOICE // AGENCY]</text>
</svg>
