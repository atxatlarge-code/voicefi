<svg xmlns="http://www.w3.org/2000/svg" viewBox="68 68 376 388" width="100%" height="100%">
  <!-- VoiceFi Master Symbol: Pure Vector - Light Theme (No Container Padding) -->
  <defs>
    <linearGradient id="vfLightSymRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="50%" stop-color="#FF2A2A" />
      <stop offset="100%" stop-color="#E0002A" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 5)">
    <!-- 1. ELECTRIC RED WI-FI BROADCAST HAT -->
    <g stroke="url(#vfLightSymRed)" stroke-linecap="round" fill="none">
      <path d="M 152 145 A 120 120 0 0 1 360 145" stroke-width="26" />
      <path d="M 184 180 A 80 80 0 0 1 328 180" stroke-width="24" />
      <path d="M 216 215 A 42 42 0 0 1 296 215" stroke-width="22" />
    </g>

    <!-- 2. CYBER FACE -->
    <!-- Eyes in Crisp Deep Black -->
    <g stroke="#0F172A" stroke-width="14" stroke-linecap="round">
      <line x1="202" y1="262" x2="234" y2="262" />
      <line x1="278" y1="262" x2="310" y2="262" />
    </g>

    <!-- USB-C Port Nose -->
    <g>
      <rect x="236" y="276" width="40" height="18" rx="9" fill="#FFFFFF" stroke="#FF2A2A" stroke-width="4" />
      <line x1="246" y1="285" x2="266" y2="285" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Friendly Electric Red Waveform Smile -->
    <path d="M 228 322 Q 256 348 284 322" fill="none" stroke="#FF2A2A" stroke-width="8" stroke-linecap="round" />

    <!-- 3. STUDIO CRADLE & PLUG BASE in Deep Black -->
    <path d="M 124 220 C 124 350, 175 385, 256 385 C 337 385, 388 350, 388 220" 
          fill="none" 
          stroke="#0F172A" 
          stroke-width="20" 
          stroke-linecap="round" />

    <!-- Plug Prongs with Red Knurled Accents -->
    <g>
      <rect x="108" y="202" width="32" height="34" rx="7" fill="#FFFFFF" stroke="#0F172A" stroke-width="4.5" />
      <circle cx="124" cy="219" r="5.5" fill="#FF2A2A" />

      <rect x="372" y="202" width="32" height="34" rx="7" fill="#FFFFFF" stroke="#0F172A" stroke-width="4.5" />
      <circle cx="388" cy="219" r="5.5" fill="#FF2A2A" />
    </g>

    <!-- Stem & Solid Base in Deep Black -->
    <line x1="256" y1="385" x2="256" y2="435" stroke="#0F172A" stroke-width="22" stroke-linecap="round" />
    <line x1="185" y1="435" x2="327" y2="435" stroke="#0F172A" stroke-width="22" stroke-linecap="round" />
  </g>
</svg>
