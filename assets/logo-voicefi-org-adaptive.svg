<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 120" width="100%" height="100%">
  <!-- VoiceFi.org Universal Adaptive Logo (Auto Light/Dark Theme via Media Query) -->
  <defs>
    <linearGradient id="vfSymRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="50%" stop-color="#FF2A2A" />
      <stop offset="100%" stop-color="#E0002A" />
    </linearGradient>
  </defs>

  <style>
    .vf-fg { stroke: #0F172A; fill: #0F172A; }
    .vf-fg-stroke { stroke: #0F172A; fill: none; }
    .vf-bg-fill { fill: #FFFFFF; }
    .vf-text-primary { fill: #0F172A; }
    .vf-text-red { fill: #FF2A2A; }
    .vf-text-muted { fill: #94A3B8; }

    @media (prefers-color-scheme: dark) {
      .vf-fg { stroke: #FFFFFF; fill: #FFFFFF; }
      .vf-fg-stroke { stroke: #FFFFFF; fill: none; }
      .vf-bg-fill { fill: #000000; }
      .vf-text-primary { fill: #FFFFFF; }
      .vf-text-muted { fill: #94A3B8; }
    }
  </style>

  <g id="voicefi-logo-group">
    <!-- ICON -->
    <g transform="translate(0, 4) scale(0.28)">
      <g transform="translate(-68, -63)">
        <!-- Red Wi-Fi Signal Hat -->
        <g stroke="url(#vfSymRed)" stroke-linecap="round" fill="none">
          <path d="M 152 145 A 120 120 0 0 1 360 145" stroke-width="26" />
          <path d="M 184 180 A 80 80 0 0 1 328 180" stroke-width="24" />
          <path d="M 216 215 A 42 42 0 0 1 296 215" stroke-width="22" />
        </g>

        <!-- Eyes -->
        <g class="vf-fg-stroke" stroke-width="14" stroke-linecap="round">
          <line x1="202" y1="262" x2="234" y2="262" />
          <line x1="278" y1="262" x2="310" y2="262" />
        </g>

        <!-- USB-C Nose -->
        <g>
          <rect x="236" y="276" width="40" height="18" rx="9" class="vf-bg-fill" stroke="#FF2A2A" stroke-width="4" />
          <line x1="246" y1="285" x2="266" y2="285" class="vf-fg-stroke" stroke-width="3.5" stroke-linecap="round" />
        </g>

        <!-- Waveform Smile -->
        <path d="M 228 322 Q 256 348 284 322" fill="none" stroke="#FF2A2A" stroke-width="8" stroke-linecap="round" />

        <!-- Studio Cradle -->
        <path d="M 124 220 C 124 350, 175 385, 256 385 C 337 385, 388 350, 388 220" 
              class="vf-fg-stroke" 
              stroke-width="20" 
              stroke-linecap="round" />

        <!-- Prongs -->
        <g>
          <rect x="108" y="202" width="32" height="34" rx="7" class="vf-bg-fill vf-fg-stroke" stroke-width="4.5" />
          <circle cx="124" cy="219" r="5.5" fill="#FF2A2A" />

          <rect x="372" y="202" width="32" height="34" rx="7" class="vf-bg-fill vf-fg-stroke" stroke-width="4.5" />
          <circle cx="388" cy="219" r="5.5" fill="#FF2A2A" />
        </g>

        <!-- Stem & Base -->
        <line x1="256" y1="385" x2="256" y2="435" class="vf-fg-stroke" stroke-width="22" stroke-linecap="round" />
        <line x1="185" y1="435" x2="327" y2="435" class="vf-fg-stroke" stroke-width="22" stroke-linecap="round" />
      </g>
    </g>

