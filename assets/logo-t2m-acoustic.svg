<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="macSquircle">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>

    <!-- Deep Midnight Slate Background -->
    <radialGradient id="slateBg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <!-- Hyper-clean Gold & Amber Spectrum -->
    <linearGradient id="goldBeam1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="goldBeam2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Smooth Bevel Shadow -->
    <filter id="pureDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <g clip-path="url(#macSquircle)">
    <!-- Canvas -->
    <rect width="512" height="512" fill="url(#slateBg)"/>

    <!-- THE ACOUSTIC T2M MARK: Pure geometric dialogue loops -->
    <g filter="url(#pureDepth)" transform="translate(0, 0)">
      
      <!-- Loop 1: The 'T' & '2' Upper Wave (Flowing acoustic arc) -->
      <path d="M 128 170 C 128 170, 256 120, 384 170 C 384 250, 320 310, 256 360 L 160 410 H 384" 
            fill="none" 
            stroke="url(#goldBeam1)" 
            stroke-width="32" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <!-- Loop 2: The 'M' Acoustic Twin Pulse (Resonating from center) -->
      <path d="M 180 340 V 240 C 180 200, 220 200, 256 245 C 292 200, 332 200, 332 240 V 340" 
            fill="none" 
            stroke="url(#goldBeam2)" 
            stroke-width="24" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            opacity="0.9"/>
      
      <!-- Central Voice Resonance Sphere -->
      <circle cx="256" cy="185" r="14" fill="#FEF08A"/>
    </g>

    <!-- Bevel Border -->
    <rect width="512" height="512" rx="115" ry="115" fill="none" stroke="#27272a" stroke-width="2"/>
  </g>
</svg>
