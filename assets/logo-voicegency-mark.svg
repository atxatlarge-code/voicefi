<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- macOS Squircle Clip -->
    <clipPath id="squircleClip">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>

    <!-- Deep Midnight Obsidian Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="45%" stop-color="#0e0e12"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>

    <!-- Ambient Core Halo -->
    <radialGradient id="centerHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Imperial Gold Spectrum (Primary) -->
    <linearGradient id="goldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Amber Metallic Secondary (Shadow / Facet) -->
    <linearGradient id="goldSecondary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Neon Accent Glow (Agency Pulse) -->
    <linearGradient id="neonPulse" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Depth Shadow -->
    <filter id="markShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g clip-path="url(#squircleClip)">
    <!-- Canvas Base -->
    <rect width="512" height="512" fill="url(#bgGlow)"/>

    <!-- Subtle Radial Glow Behind Mark -->
    <circle cx="256" cy="256" r="180" fill="url(#centerHalo)"/>

    <!-- Ambient Grid Texture (Subtle) -->
    <g opacity="0.04" stroke="#ffffff" stroke-width="1">
      <line x1="64" y1="0" x2="64" y2="512"/>
      <line x1="128" y1="0" x2="128" y2="512"/>
      <line x1="192" y1="0" x2="192" y2="512"/>
      <line x1="256" y1="0" x2="256" y2="512"/>
      <line x1="320" y1="0" x2="320" y2="512"/>
      <line x1="384" y1="0" x2="384" y2="512"/>
      <line x1="448" y1="0" x2="448" y2="512"/>
      <line x1="0" y1="64" x2="512" y2="64"/>
      <line x1="0" y1="128" x2="512" y2="128"/>
      <line x1="0" y1="192" x2="512" y2="192"/>
      <line x1="0" y1="256" x2="512" y2="256"/>
      <line x1="0" y1="320" x2="512" y2="320"/>
      <line x1="0" y1="384" x2="512" y2="384"/>
      <line x1="0" y1="448" x2="512" y2="448"/>
    </g>

    <!-- THE VOICEGENCY MARK: "V-Wave & Agency Delta" -->
    <g filter="url(#markShadow)" id="symbolGroup">
      
      <!-- Outer Acoustic Voice Wings (Left Wing) -->
      <path d="M 120 148 L 176 148 L 236 310 L 200 310 Z" 
            fill="url(#goldSecondary)" opacity="0.6"/>
      <path d="M 96 180 C 80 216 80 264 100 296" 
            fill="none" stroke="url(#goldPrimary)" stroke-width="10" stroke-linecap="round" opacity="0.4"/>
      <path d="M 64 200 C 50 230 50 260 68 284" 
            fill="none" stroke="url(#goldPrimary)" stroke-width="6" stroke-linecap="round" opacity="0.2"/>

      <!-- Outer Acoustic Voice Wings (Right Wing) -->
      <path d="M 392 148 L 336 148 L 276 310 L 312 310 Z" 
            fill="url(#goldSecondary)" opacity="0.6"/>
      <path d="M 416 180 C 432 216 432 264 412 296" 
            fill="none" stroke="url(#goldPrimary)" stroke-width="10" stroke-linecap="round" opacity="0.4"/>
      <path d="M 448 200 C 462 230 462 260 444 284" 
            fill="none" stroke="url(#goldPrimary)" stroke-width="6" stroke-linecap="round" opacity="0.2"/>

      <!-- Primary 'V' Monogram Structure (Left Blade) -->
      <path d="M 148 136 L 208 136 L 256 320 L 226 320 Z" 
            fill="url(#goldPrimary)"/>

      <!-- Primary 'V' Monogram Structure (Right Blade - Front Facet) -->
      <path d="M 364 136 L 304 136 L 256 320 L 286 320 Z" 
            fill="url(#goldPrimary)"/>

      <!-- Central Agency Delta / Compass Arrow (Ascending Autonomous Intent) -->
      <polygon points="256,170 292,260 256,242 220,260" 
               fill="url(#goldPrimary)"/>
      <polygon points="256,170 256,242 220,260" 
               fill="url(#goldSecondary)" opacity="0.6"/>

      <!-- The Vocal Resonance Core Node (Origin of Speech) -->
      <circle cx="256" cy="380" r="16" fill="#FFFBEB" filter="drop-shadow(0 0 10px #F59E0B)"/>
      <circle cx="256" cy="380" r="28" fill="none" stroke="url(#goldPrimary)" stroke-width="3" opacity="0.6"/>
      <circle cx="256" cy="380" r="42" fill="none" stroke="url(#goldPrimary)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.35"/>

      <!-- Grounding Acoustic Anchor -->
      <path d="M 230 436 H 282" stroke="url(#goldPrimary)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <path d="M 244 448 H 268" stroke="url(#goldPrimary)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- Beveled Premium Border Ring -->
    <rect width="512" height="512" rx="115" ry="115" fill="none" stroke="#2a2a32" stroke-width="2.5"/>
    <rect width="512" height="512" rx="115" ry="115" fill="none" stroke="url(#goldPrimary)" stroke-width="1" opacity="0.15"/>
  </g>
</svg>
