<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Stark White Canvas -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Minimal Frame -->
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#EAEAEA" stroke-width="1.5"/>

  <!-- Technical Header -->
  <text x="52" y="58" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">RE20-C // BROADCAST STENCIL</text>
  <rect x="254" y="48" width="76" height="14" fill="#FF2A2A"/>
  <text x="292" y="59" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" text-anchor="middle" letter-spacing="1">● ON AIR</text>
  <text x="460" y="58" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">SWISS PURIST</text>

  <!-- THE RE20 BROADCAST STENCIL (Pure Geometry) -->
  <g id="re20MarkC" transform="translate(0, 10)">
    
    <!-- OUTER YOKE CRADLE (The 'V' Frame) -->
    <path d="M 120 150 L 152 150 L 228 366 L 196 366 Z" fill="#000000"/>
    <path d="M 392 150 L 360 150 L 284 366 L 316 366 Z" fill="#000000"/>

    <!-- Yoke Pivot Rings -->
    <circle cx="136" cy="216" r="14" fill="#000000"/>
    <circle cx="136" cy="216" r="6" fill="#FFFFFF"/>
    
    <circle cx="376" cy="216" r="14" fill="#000000"/>
    <circle cx="376" cy="216" r="6" fill="#FFFFFF"/>

    <!-- INNER BROADCAST MIC BODY (The 'A' Pillar) -->
    <!-- Dome Head -->
    <path d="M 194 96 C 194 50, 318 50, 318 96 Z" fill="#000000"/>
    <line x1="216" y1="76" x2="296" y2="76" stroke="#FF2A2A" stroke-width="8"/>

    <!-- Microphone Cylinder Body -->
    <rect x="194" y="100" width="124" height="176" fill="#000000"/>

    <!-- Horizontal Acoustic Louvers (White Negative Space Bars) -->
    <g fill="#FFFFFF">
      <rect x="210" y="112" width="92" height="8"/>
      <rect x="210" y="128" width="92" height="8"/>
      <rect x="210" y="144" width="92" height="8"/>
      <rect x="210" y="160" width="92" height="8"/>
      <rect x="210" y="176" width="92" height="8"/>
      <rect x="210" y="192" width="92" height="8"/>
    </g>

    <!-- THE HORIZONTAL 'A' CROSSBAR / RE20 CLAMP RING -->
    <rect x="156" y="208" width="200" height="18" fill="#000000"/>
    <rect x="164" y="212" width="184" height="10" fill="#FF2A2A"/>

    <!-- Dynamic Diaphragm Core Node -->
    <circle cx="256" cy="254" r="20" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="256" cy="254" r="12" fill="#FF2A2A"/>
    <circle cx="256" cy="254" r="4" fill="#FFD166"/>

    <!-- Lower Mic Body Taper & Stand Mount -->
    <polygon points="208,276 304,276 284,340 228,340" fill="#000000"/>
    <circle cx="256" cy="388" r="14" fill="#000000"/>
    <rect x="238" y="414" width="36" height="14" fill="#000000"/>
    <rect x="248" y="428" width="16" height="6" fill="#FF2A2A"/>
  </g>

  <!-- Technical Footer -->
  <text x="52" y="462" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">YOKE PIVOT &amp; LOUVER CORE</text>
  <text x="460" y="462" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="end">MAX 16PX BROADCAST</text>
</svg>
