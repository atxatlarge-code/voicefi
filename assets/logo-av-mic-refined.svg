<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- macOS Squircle Clip -->
    <clipPath id="squircleClip">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>

    <!-- Deep Midnight Obsidian Canvas -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#16161c"/>
      <stop offset="50%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#030305"/>
    </radialGradient>

    <!-- Imperial Gold Spectrum (Primary) -->
    <linearGradient id="goldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Warm Amber Metallic Facet (Secondary) -->
    <linearGradient id="goldSecondary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Drop Shadow for Optical Depth -->
    <filter id="pureDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g clip-path="url(#squircleClip)">
    <!-- Background Canvas -->
    <rect width="512" height="512" fill="url(#bgGlow)"/>

    <!-- Subtle Technical Background Grid -->
    <g opacity="0.05" stroke="#ffffff" stroke-width="1">
      <line x1="64" y1="0" x2="64" y2="512"/>
      <line x1="128" y1="0" x2="128" y2="512"/>
      <line x1="192" y1="0" x2="192" y2="512"/>
      <line x1="256" y1="0" x2="256" y2="512"/>
      <line x1="320" y1="0" x2="320" y2="512"/>
      <line x1="384" y1="0" x2="384" y2="512"/>
      <line x1="448" y1="0" x2="448" y2="512"/>
      <line x1="0" y1="64" x2="512" y2="64"/>
      <line x1="0" y1="128" x2="512" y2="128"/>
      <line x1="0" y1="192" x2="512" y2="192"/>
      <line x1="0" y1="256" x2="512" y2="256"/>
      <line x1="0" y1="320" x2="512" y2="320"/>
      <line x1="0" y1="384" x2="512" y2="384"/>
      <line x1="0" y1="448" x2="512" y2="448"/>
    </g>

    <!-- THE AV MICROPHONE MONOGRAM -->
    <g filter="url(#pureDepth)" id="avMonogram">
      
      <!-- Outer Acoustic Microphone Wings (Sound Dispersion) -->
      <g opacity="0.45">
        <path d="M 88 176 C 72 216 72 268 94 308" fill="none" stroke="url(#goldPrimary)" stroke-width="12" stroke-linecap="round"/>
        <path d="M 56 196 C 42 230 42 262 62 292" fill="none" stroke="url(#goldPrimary)" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
        
        <path d="M 424 176 C 440 216 440 268 418 308" fill="none" stroke="url(#goldPrimary)" stroke-width="12" stroke-linecap="round"/>
        <path d="M 456 196 C 470 230 470 262 450 292" fill="none" stroke="url(#goldPrimary)" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
      </g>

      <!-- THE 'V' (VOICE / MICROPHONE CHASSIS & OUTER GRILLE) -->
      <!-- Left V Blade -->
      <polygon points="128,118 196,118 256,330 220,330" fill="url(#goldPrimary)"/>
      <polygon points="112,130 148,130 220,330 196,330" fill="url(#goldSecondary)" opacity="0.6"/>

      <!-- Right V Blade -->
      <polygon points="384,118 316,118 256,330 292,330" fill="url(#goldPrimary)"/>
      <polygon points="400,130 364,130 292,330 316,330" fill="url(#goldSecondary)" opacity="0.6"/>

      <!-- Microphone Acoustic Top Grille Slits (Horizontal Ribs between V Arms) -->
      <g opacity="0.85">
        <rect x="216" y="104" width="80" height="8" rx="4" fill="url(#goldPrimary)"/>
        <rect x="226" y="122" width="60" height="8" rx="4" fill="url(#goldPrimary)"/>
        <rect x="236" y="140" width="40" height="8" rx="4" fill="url(#goldPrimary)"/>
      </g>

      <!-- THE 'A' (AGENCY / ASCENDING ARROW / DIAPHRAGM) NESTED INSIDE 'V' -->
      <!-- Ascending Agency Triangle / Chevron Apex -->
      <polygon points="256,160 306,270 256,246 206,270" fill="url(#goldPrimary)"/>
      <polygon points="256,160 256,246 206,270" fill="url(#goldSecondary)" opacity="0.55"/>

      <!-- The 'A' Crossbar (Acoustic Capsule Bridge) -->
      <rect x="206" y="254" width="100" height="14" rx="7" fill="url(#goldPrimary)"/>

      <!-- Central Acoustic Diaphragm Core / Node (Microphone Pickup Element) -->
      <circle cx="256" cy="380" r="18" fill="#FFFDF5" filter="drop-shadow(0 0 12px #F59E0B)"/>
      <circle cx="256" cy="380" r="32" fill="none" stroke="url(#goldPrimary)" stroke-width="3" opacity="0.6"/>
      <circle cx="256" cy="380" r="48" fill="none" stroke="url(#goldPrimary)" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.35"/>

      <!-- Microphone Base Stand / Grounding Anchor -->
      <rect x="230" y="432" width="52" height="6" rx="3" fill="url(#goldPrimary)" opacity="0.85"/>
      <rect x="242" y="446" width="28" height="5" rx="2.5" fill="url(#goldPrimary)" opacity="0.5"/>
    </g>

    <!-- Beveled Premium Border Ring -->
    <rect width="512" height="512" rx="115" ry="115" fill="none" stroke="#25252d" stroke-width="2.5"/>
    <rect width="512" height="512" rx="115" ry="115" fill="none" stroke="url(#goldPrimary)" stroke-width="1" opacity="0.18"/>
  </g>
</svg>
