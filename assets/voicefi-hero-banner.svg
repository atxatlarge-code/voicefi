<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- VoiceFi Master Banner (Pixel-Perfect Vector Source) -->
  <defs>
    <linearGradient id="redSignal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="50%" stop-color="#FF2A2A" />
      <stop offset="100%" stop-color="#E0002A" />
    </linearGradient>

    <radialGradient id="haloBg" cx="75%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FF2A2A" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <filter id="pillShadow" x="-10%" y="-20%" width="130%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Canvas Background & Ambient Halo -->
  <rect width="1200" height="630" fill="#FFFFFF" />
  <rect width="1200" height="630" fill="url(#haloBg)" />
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- LEFT COLUMN -->
  <g transform="translate(60, 0)">
    <!-- Styled Wordmark -->
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="96" fill="#0A0A0C" letter-spacing="-4">
      <tspan fill="#FF2A2A">V</tspan>o<tspan fill="#FF2A2A">i</tspan>ce<tspan fill="#FF2A2A">Fi</tspan><tspan font-size="78" font-weight="700" fill="#94A3B8" dy="0" letter-spacing="-2">.org</tspan>
    </text>

    <!-- Subheadline -->
    <text x="0" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="27" fill="#0F172A" letter-spacing="-0.6">
      The Universal Voice Layer for AI Agents &amp; macOS
    </text>

    <!-- Feature Bullets -->
    <g transform="translate(0, 325)" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="16" fill="#475569">
      <text x="0" y="0"><tspan fill="#FF2A2A" font-weight="900">✦ </tspan><tspan fill="#0F172A" font-weight="700">Spoken Agent Feedback:</tspan> Gives agents &amp; dev tools a voice to speak turn completions aloud</text>
      <text x="0" y="33"><tspan fill="#FF2A2A" font-weight="900">✦ </tspan><tspan fill="#FF2A2A" font-weight="700">Pro</tspan><tspan fill="#0F172A" font-weight="700">Active Listening:</tspan> Hands-free auto-mic capture with acoustic safety &amp; VAD</text>
      <text x="0" y="66"><tspan fill="#FF2A2A" font-weight="900">✦ </tspan><tspan fill="#0F172A" font-weight="700">On-Device Whisper:</tspan> 10× faster than cloud dictation (~80ms Apple Silicon inference)</text>
      <text x="0" y="99"><tspan fill="#FF2A2A" font-weight="900">✦ </tspan><tspan fill="#0F172A" font-weight="700">Developer Native:</tspan> Zero cloud dependencies · Claude, Antigravity &amp; Cursor</text>
    </g>
  </g>

  <!-- Horizontal Divider Line -->
  <line x1="60" y1="515" x2="1140" y2="515" stroke="#F1F5F9" stroke-width="1.5" />

  <!-- FOOTER -->
  <!-- Terminal Command Pill Button -->
  <g transform="translate(60, 532)" filter="url(#pillShadow)">
    <rect width="264" height="48" rx="8" fill="#0F172A" />
    <text x="20" y="30" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="15" font-weight="700">
      <tspan fill="#FF2A2A">$&gt; </tspan><tspan fill="#FFFFFF">curl -fsSL vifi.sh | sh</tspan>
    </text>
  </g>

  <!-- Open Source Footer Right -->
  <text x="1140" y="562" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="14" font-weight="500" fill="#64748B" letter-spacing="0.3">
    Open Source Protocol · voicefi.org
  </text>

  <!-- RIGHT COLUMN: Freestanding Master VoiceFi Cyber Character Mark -->
  <g transform="translate(730, 45) scale(0.92)">
    <!-- 1. Electric Red Wi-Fi Broadcast Hat -->
    <path d="M 152 145 A 120 120 0 0 1 360 145" fill="none" stroke="url(#redSignal)" stroke-width="20" stroke-linecap="round" />
    <path d="M 184 180 A 80 80 0 0 1 328 180" fill="none" stroke="url(#redSignal)" stroke-width="19" stroke-linecap="round" />
    <path d="M 216 215 A 42 42 0 0 1 296 215" fill="none" stroke="url(#redSignal)" stroke-width="18" stroke-linecap="round" />

    <!-- 2. Cyber Eyes in Crisp Black -->
    <line x1="202" y1="262" x2="234" y2="262" stroke="#000000" stroke-width="9" stroke-linecap="round" />
    <line x1="278" y1="262" x2="310" y2="262" stroke="#000000" stroke-width="9" stroke-linecap="round" />

    <!-- 3. USB-C Port Nose -->
    <rect x="238" y="278" width="36" height="16" rx="8" fill="#FFFFFF" stroke="#FF2A2A" stroke-width="3" />
    <line x1="246" y1="286" x2="266" y2="286" stroke="#000000" stroke-width="3" stroke-linecap="round" />

    <!-- Waveform Smile -->
    <path d="M 230 320 Q 256 344 282 320" fill="none" stroke="#FF2A2A" stroke-width="6" stroke-linecap="round" />

    <!-- 4. Studio Cradle & Base -->
    <path d="M 124 220 C 124 350, 175 385, 256 385 C 337 385, 388 350, 388 220" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round" />
    
    <!-- Plug Prongs -->
    <rect x="108" y="204" width="30" height="32" rx="7" fill="#FFFFFF" stroke="#000000" stroke-width="3.5" />
    <circle cx="123" cy="220" r="4" fill="#FF2A2A" />

    <rect x="374" y="204" width="30" height="32" rx="7" fill="#FFFFFF" stroke="#000000" stroke-width="3.5" />
    <circle cx="389" cy="220" r="4.5" fill="#FF2A2A" />

    <!-- Stem & Base Bar -->
    <line x1="256" y1="385" x2="256" y2="432" stroke="#000000" stroke-width="15" stroke-linecap="round" />
    <line x1="188" y1="432" x2="324" y2="432" stroke="#000000" stroke-width="15" stroke-linecap="round" />
  </g>
</svg>