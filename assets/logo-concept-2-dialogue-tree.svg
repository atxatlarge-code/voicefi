<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Charcoal Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>

    <!-- Warm Champagne Gold Gradient -->
    <linearGradient id="goldLuxury" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="35%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <!-- Radial Gold Accent -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background App Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad2)"/>
  <rect width="510" height="510" x="1" y="1" rx="107" fill="none" stroke="#26262b" stroke-width="2"/>
  
  <!-- Subtle Ambient Glow in Center -->
  <circle cx="256" cy="240" r="160" fill="url(#glowCenter)"/>

  <!-- Logo Mark: Modern Geometric Tree formed by Symmetrical Dialogue Sound Arcs -->
  <g transform="translate(0, 0)">
    
    <!-- Central Sound Beam / Trunk -->
    <line x1="256" y1="410" x2="256" y2="180" stroke="url(#goldLuxury)" stroke-width="8" stroke-linecap="round"/>

    <!-- Concentric Voice Arcs / Branch Waves -->
    <!-- Lower Tier Arcs -->
    <path d="M 180 340 C 205 310 235 295 256 295 C 277 295 307 310 332 340" 
          fill="none" stroke="url(#goldLuxury)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Mid Tier Arcs (Wider Dialogue Wings) -->
    <path d="M 130 260 C 170 215 215 200 256 200 C 297 200 342 215 382 260" 
          fill="none" stroke="url(#goldLuxury)" stroke-width="6" stroke-linecap="round"/>

    <!-- Upper Tier Arcs -->
    <path d="M 160 170 C 190 140 225 125 256 125 C 287 125 322 140 352 170" 
          fill="none" stroke="url(#goldLuxury)" stroke-width="6" stroke-linecap="round"/>

    <!-- Top Crown Leaf / Wave Crest -->
    <path d="M 256 125 C 245 95 240 75 256 55 C 272 75 267 95 256 125 Z" 
          fill="url(#goldLuxury)"/>

    <!-- Geometric Leaf Pods on Arc Terminals -->
    <!-- Mid Tier Leaf Nodes -->
    <ellipse cx="130" cy="260" rx="10" ry="6" transform="rotate(-35 130 260)" fill="url(#goldLuxury)"/>
    <ellipse cx="382" cy="260" rx="10" ry="6" transform="rotate(35 382 260)" fill="url(#goldLuxury)"/>

    <!-- Upper Tier Leaf Nodes -->
    <ellipse cx="160" cy="170" rx="9" ry="5.5" transform="rotate(-40 160 170)" fill="url(#goldLuxury)"/>
    <ellipse cx="352" cy="170" rx="9" ry="5.5" transform="rotate(40 352 170)" fill="url(#goldLuxury)"/>

    <!-- Lower Tier Leaf Nodes -->
    <ellipse cx="180" cy="340" rx="8" ry="5" transform="rotate(-30 180 340)" fill="url(#goldLuxury)"/>
    <ellipse cx="332" cy="340" rx="8" ry="5" transform="rotate(30 332 340)" fill="url(#goldLuxury)"/>

    <!-- Base Soundwave Grounding Nodes -->
    <circle cx="210" cy="410" r="4" fill="url(#goldLuxury)" opacity="0.6"/>
    <circle cx="165" cy="410" r="3.5" fill="url(#goldLuxury)" opacity="0.4"/>
    <circle cx="302" cy="410" r="4" fill="url(#goldLuxury)" opacity="0.6"/>
    <circle cx="347" cy="410" r="3.5" fill="url(#goldLuxury)" opacity="0.4"/>
    
    <!-- Base Microphone Sound Wave Bar Accent -->
    <line x1="210" y1="410" x2="302" y2="410" stroke="url(#goldLuxury)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
