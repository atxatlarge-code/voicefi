<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <!-- VoiceFi Master Studio Wordmark (Transparent Dark - Borderless) -->
  <defs>
    <linearGradient id="vfWmRedDarkTrans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="50%" stop-color="#FF2A2A" />
      <stop offset="100%" stop-color="#E0002A" />
    </linearGradient>
  </defs>

  <!-- Left: Official VoiceFi Character Logo (Dark Theme) -->
  <g transform="translate(10, 10) scale(0.52)">
    <!-- 1. Wi-Fi Broadcast Hat -->
    <g stroke="url(#vfWmRedDarkTrans)" stroke-linecap="round" fill="none">
      <path d="M 152 145 A 120 120 0 0 1 360 145" stroke-width="26" />
      <path d="M 184 180 A 80 80 0 0 1 328 180" stroke-width="24" />
      <path d="M 216 215 A 42 42 0 0 1 296 215" stroke-width="22" />
    </g>

    <!-- 2. Cyber Face -->
    <g stroke="#FFFFFF" stroke-width="14" stroke-linecap="round">
      <line x1="202" y1="262" x2="234" y2="262" />
      <line x1="278" y1="262" x2="310" y2="262" />
    </g>

    <!-- USB-C Port Nose -->
    <g>
      <rect x="236" y="276" width="40" height="18" rx="9" fill="#000000" stroke="#FF2A2A" stroke-width="4" />
      <line x1="246" y1="285" x2="266" y2="285" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Friendly Electric Red Waveform Smile -->
    <path d="M 228 322 Q 256 348 284 322" fill="none" stroke="#FF2A2A" stroke-width="8" stroke-linecap="round" />

    <!-- 3. Studio Cradle & Plug Base -->
    <path d="M 124 220 C 124 350, 175 385, 256 385 C 337 385, 388 350, 388 220" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="20" 
          stroke-linecap="round" />

    <!-- Plug Prongs with Red Knurled Accents -->
    <g>
      <rect x="108" y="202" width="32" height="34" rx="7" fill="#000000" stroke="#FFFFFF" stroke-width="4.5" />
      <circle cx="124" cy="219" r="5.5" fill="#FF2A2A" />

      <rect x="372" y="202" width="32" height="34" rx="7" fill="#000000" stroke="#FFFFFF" stroke-width="4.5" />
      <circle cx="388" cy="219" r="5.5" fill="#FF2A2A" />
    </g>

    <!-- Stem & Solid Base -->
    <line x1="256" y1="385" x2="256" y2="435" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" />
    <line x1="185" y1="435" x2="327" y2="435" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" />
  </g>

  <!-- Typography: VoiceFi.org with White ViFi and Red "oce" Recording Accents -->
  <text x="290" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="78" letter-spacing="-2.5">
    <tspan fill="#FFFFFF">V</tspan><tspan fill="#FF2A2A">o</tspan><tspan fill="#FFFFFF">i</tspan><tspan fill="#FF2A2A">ce</tspan><tspan fill="#FFFFFF">Fi</tspan><tspan fill="#64748B" font-size="52" font-weight="700" letter-spacing="-1">.org</tspan>
  </text>

  <!-- Tagline -->
  <text x="293" y="168" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#94A3B8" letter-spacing="2">
    OPEN SOURCE VOICE PROTOCOL · <tspan fill="#FF2A2A" font-weight="800">VOICEFI.ORG</tspan>
  </text>
</svg>
