<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure White Canvas -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Minimal Frame -->
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#EAEAEA" stroke-width="1.5"/>
  <text x="52" y="58" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">MINIMAL 01 // 3-STROKE MONOLITH</text>
  <rect x="254" y="48" width="76" height="14" fill="#FF2A2A"/>
  <text x="292" y="59" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" text-anchor="middle">● ON AIR</text>
  <text x="460" y="58" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">VOICEGENCY</text>

  <!-- THE MARK: 01 THE 3-STROKE MONOLITH (Purest Essence) -->
  <g id="minimal01" transform="translate(0, 16)">
    
    <!-- Top Capsule Arch (Studio Mic Dome) -->
    <path d="M 196 90 C 196 46, 316 46, 316 90" fill="none" stroke="#000000" stroke-width="22" stroke-linecap="square"/>

    <!-- THE BIG 'V' / YOKE (Two Heavy Monolithic Blades) -->
    <polygon points="120,110 186,110 256,366 220,366" fill="#000000"/>
    <polygon points="392,110 326,110 256,366 292,366" fill="#000000"/>

    <!-- THE 'A' CROSSBAR (Single Solid Red Tally Bar) -->
    <!-- Locks across the V, creating the 'A' and the studio shockmount clamp in one single stroke -->
    <rect x="160" y="206" width="192" height="20" fill="#FF2A2A"/>

    <!-- Single Acoustic Diaphragm Core Node -->
    <circle cx="256" cy="144" r="22" fill="#000000"/>
    <circle cx="256" cy="144" r="8" fill="#FF2A2A"/>

    <!-- Base Mount Notch -->
    <rect x="238" y="400" width="36" height="14" fill="#000000"/>
  </g>
</svg>
