<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- macOS Squircle Clip -->
    <clipPath id="squircleClip2">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>

    <!-- Deep Midnight Slate Gradient -->
    <radialGradient id="slateBg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#181820"/>
      <stop offset="55%" stop-color="#0c0c10"/>
      <stop offset="100%" stop-color="#040406"/>
    </radialGradient>

    <!-- Warm Amber Gold Gradient -->
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="goldShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Drop Shadow Depth -->
    <filter id="avGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g clip-path="url(#squircleClip2)">
    <rect width="512" height="512" fill="url(#slateBg)"/>

    <!-- Subtle Radial Glow -->
    <circle cx="256" cy="240" r="160" fill="#F59E0B" opacity="0.08" filter="blur(30px)"/>

    <!-- THE INTERLOCKING AV CONDENSER CAPSULE -->
    <g filter="url(#avGlow)" id="interlockingMark" transform="translate(0, -10)">
      
      <!-- Microphone Capsule Outer Arc (Top Grille Dome) -->
      <path d="M 172 170 C 172 120, 340 120, 340 170" fill="none" stroke="url(#goldBeam)" stroke-width="16" stroke-linecap="round"/>
      <line x1="200" y1="140" x2="312" y2="140" stroke="url(#goldBeam)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
      <line x1="224" y1="120" x2="288" y2="120" stroke="url(#goldBeam)" stroke-width="5" stroke-linecap="round" opacity="0.4"/>

      <!-- THE 'A' STRUCTURE (Rises up into the capsule) -->
      <!-- Left Leg of A -->
      <polygon points="256,150 200,320 236,320 256,256" fill="url(#goldBeam)"/>
      <!-- Right Leg of A -->
      <polygon points="256,150 312,320 276,320 256,256" fill="url(#goldShadow)"/>
      <!-- 'A' Crossbar (Microphone Diaphragm Clamp) -->
      <rect x="194" y="244" width="124" height="18" rx="9" fill="url(#goldBeam)"/>

      <!-- THE 'V' STRUCTURE (Interlocking with A and wrapping the mic body) -->
      <!-- Outer Left V Blade -->
      <path d="M 120 180 L 160 180 L 236 390 L 202 390 Z" fill="url(#goldBeam)"/>
      <!-- Outer Right V Blade -->
      <path d="M 392 180 L 352 180 L 276 390 L 310 390 Z" fill="url(#goldBeam)"/>

      <!-- Acoustic Louvers / Grille Slits along V Outer Wings -->
      <g stroke="url(#goldBeam)" stroke-width="6" stroke-linecap="round" opacity="0.5">
        <line x1="96" y1="210" x2="132" y2="210"/>
        <line x1="84" y1="240" x2="126" y2="240"/>
        <line x1="92" y1="270" x2="138" y2="270"/>
        
        <line x1="416" y1="210" x2="380" y2="210"/>
        <line x1="428" y1="240" x2="386" y2="240"/>
        <line x1="420" y1="270" x2="374" y2="270"/>
      </g>

      <!-- Microphone Base Connector (Audio XLR Stand) -->
      <path d="M 236 390 L 276 390 L 268 440 L 244 440 Z" fill="url(#goldBeam)"/>
      <circle cx="256" cy="415" r="4" fill="#0c0c10"/>

      <!-- Central Acoustic Resonance Pulse (Golden Voice Core) -->
      <circle cx="256" cy="204" r="14" fill="#FFFDF0" filter="drop-shadow(0 0 8px #FDE047)"/>
      <circle cx="256" cy="204" r="24" fill="none" stroke="url(#goldBeam)" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- Outer Squircle Ring -->
    <rect width="512" height="512" rx="115" ry="115" fill="none" stroke="#26262e" stroke-width="2.5"/>
    <rect width="512" height="512" rx="115" ry="115" fill="none" stroke="url(#goldBeam)" stroke-width="1" opacity="0.15"/>
  </g>
</svg>
