<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgDark3" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </radialGradient>

    <!-- Vibrant Gold Gradient -->
    <linearGradient id="goldFluid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="25%" stop-color="#FACC15"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background App Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgDark3)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#292524" stroke-width="2"/>

  <!-- Logo Mark: Modern 'Voicegency' Fluid + Voice Waveform + Sprouting Golden Leaf -->
  <g filter="url(#softShadow)" transform="translate(0, 0)">
    
    <!-- Central Fluid '2' Loop -->
    <!-- The Head and Diagonal of the 2 -->
    <path d="M 170 200 C 170 140 220 110 270 110 C 330 110 370 150 370 205 C 370 255 330 300 250 360 L 170 415 H 375" 
          fill="none" 
          stroke="url(#goldFluid)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Sprouting Golden Leaf from the top curve of the '2' -->
    <path d="M 285 110 C 295 65 340 50 360 70 C 365 105 325 120 285 110 Z" 
          fill="url(#goldFluid)"/>

    <!-- Voice Equalizer Bars coming off the base of the '2' -->
    <line x1="165" y1="365" x2="165" y2="335" stroke="url(#goldFluid)" stroke-width="8" stroke-linecap="round"/>
    <line x1="140" y1="380" x2="140" y2="320" stroke="url(#goldFluid)" stroke-width="8" stroke-linecap="round"/>
    <line x1="115" y1="375" x2="115" y2="340" stroke="url(#goldFluid)" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Audio Wave Resonance Dots / Voice Pulse -->
    <circle cx="405" cy="415" r="7" fill="url(#goldFluid)"/>
    <circle cx="430" cy="415" r="4.5" fill="url(#goldFluid)" opacity="0.6"/>

  </g>
</svg>
