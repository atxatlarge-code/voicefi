<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Void Black Canvas -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Minimal Border Frame & Crosshairs -->
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#1c1c1c" stroke-width="1.5"/>
  <path d="M 256 20 V 36 M 256 476 V 492 M 20 256 H 36 M 476 256 H 492" stroke="#333333" stroke-width="1.5"/>

  <!-- Header Coordinate Stamp -->
  <text x="52" y="58" fill="#D4FF00" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1.5">01-A // STREAMLINED</text>
  <text x="460" y="58" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">VOICEGENCY</text>

  <!-- THE MARK: 01-A STREAMLINED MONOLITH -->
  <g id="mark01A" transform="translate(0, 12)">
    
    <!-- Top Acoustic Grille Header (Balanced Stepped Bars) -->
    <rect x="216" y="80" width="80" height="8" fill="#D4FF00"/>
    <rect x="228" y="96" width="56" height="8" fill="#D4FF00"/>
    <rect x="240" y="112" width="32" height="8" fill="#D4FF00"/>

    <!-- THE 'V' (Voice / Microphone Chassis) - Solid White Geometric Slabs -->
    <!-- Left V Arm -->
    <polygon points="116,134 180,134 256,336 222,336" fill="#FFFFFF"/>
    <!-- Right V Arm -->
    <polygon points="396,134 332,134 256,336 290,336" fill="#FFFFFF"/>

    <!-- Acoustic Slits Cut into V Arms (Negative Space) -->
    <g fill="#000000">
      <polygon points="152,162 178,162 166,182 140,182"/>
      <polygon points="168,194 194,194 182,214 156,214"/>
      <polygon points="184,226 210,226 198,246 172,246"/>

      <polygon points="360,162 334,162 346,182 372,182"/>
      <polygon points="344,194 318,194 330,214 356,214"/>
      <polygon points="328,226 302,226 314,246 340,246"/>
    </g>

    <!-- THE 'A' (Agency Arrow) - Nested Acid Volt Delta with Inner Negative Cut -->
    <!-- Solid Ascending Chevron Apex -->
    <polygon points="256,140 304,240 256,218 208,240" fill="#D4FF00"/>

    <!-- 'A' Horizontal Acoustic Crossbar (Diaphragm Clamp) -->
    <rect x="194" y="244" width="124" height="14" fill="#D4FF00"/>

    <!-- Central Acoustic Diaphragm Core Node -->
    <circle cx="256" cy="378" r="16" fill="#D4FF00"/>
    <circle cx="256" cy="378" r="28" fill="none" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Microphone Base Anchor Bar -->
    <rect x="236" y="422" width="40" height="8" fill="#FFFFFF"/>
  </g>

  <!-- Technical Footer -->
  <text x="52" y="462" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">OPTICAL HARMONY</text>
  <text x="460" y="462" fill="#D4FF00" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="end">PERFECTED SLITS</text>
</svg>
