    };

    let activeReelKey = "dull_boy";

    function showToast(msg, duration = 3000) {
      const toast = document.getElementById('toastNotification');
      const text = document.getElementById('toastMessage');
      if (!toast || !text) return;
      text.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, duration);
    }

    function selectReel(key) {
      activeReelKey = key;
      const data = REELS_DATA[key];
      if (!data) return;

      const videoBorder = document.getElementById('videoBorder');
      const audioBorder = document.getElementById('audioBorder');
      const video = document.getElementById('reelVideo');
      const audio = document.getElementById('reelAudio');
      const btnLeadSheet = document.getElementById('btnLeadSheet');
      const btnSaveText = document.getElementById('btnSaveText');
      const btnSavePrimary = document.getElementById('btnSavePrimary');
      const btnSaveAudio = document.getElementById('btnSaveAudio');

      if (data.isAudio) {
        if (video) video.pause();
        videoBorder.classList.add('hidden');
        audioBorder.classList.remove('hidden');
        if (audio) {
          audio.src = data.audio;
          audio.load();
        }
        if (btnLeadSheet) {
          if (data.sheet) btnLeadSheet.classList.remove('hidden');
          else btnLeadSheet.classList.add('hidden');
        }
        if (btnSaveText) btnSaveText.innerText = "Save Audio Master (.mp3)";
        if (btnSavePrimary) btnSavePrimary.className = "w-full py-3 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 active:scale-[0.98] text-black font-extrabold text-xs flex items-center justify-center gap-2 shadow-[0_4px_20px_rgba(245,158,11,0.35)] transition-all cursor-pointer";
        if (btnSaveAudio) btnSaveAudio.classList.add('hidden');
      } else {
        if (audio) audio.pause();
        audioBorder.classList.add('hidden');
        videoBorder.classList.remove('hidden');
        if (data.isWidescreen) {
          videoBorder.className = "relative w-full aspect-video max-w-sm bg-black rounded-3xl overflow-hidden border-2 border-amber-500/40 shadow-[0_0_40px_rgba(245,158,11,0.25)] flex items-center justify-center";
          video.className = "w-full h-full object-contain";
        } else {
          const borderClass = data.themeColor === "#EF4444" ? "border-red-500/40 shadow-[0_0_40px_rgba(239,68,68,0.25)]" : (data.themeColor === "#8B9A46" ? "border-[#8B9A46]/40 shadow-[0_0_40px_rgba(139,154,70,0.25)]" : "border-[#38BDF8]/40 shadow-[0_0_40px_rgba(56,189,248,0.25)]");
          videoBorder.className = `relative w-full aspect-[9/16] max-w-[220px] bg-black rounded-3xl overflow-hidden border-2 ${borderClass} flex items-center justify-center`;
          video.className = "w-full h-full object-cover";
        }
        if (video) {
          video.src = data.video;
          video.load();
        }
        if (btnLeadSheet) {
          if (data.sheet) {
            btnLeadSheet.href = data.sheet;
            btnLeadSheet.classList.remove('hidden');
          } else {
            btnLeadSheet.classList.add('hidden');
          }
        }
        if (btnSaveText) btnSaveText.innerText = data.isWidescreen ? "Save Video Cut (.mp4)" : "Save 9:16 Video Reel (.mp4)";
        if (btnSavePrimary) btnSavePrimary.className = "w-full py-3 px-4 rounded-xl bg-red-600 hover:bg-red-500 active:scale-[0.98] text-white font-extrabold text-xs flex items-center justify-center gap-2 shadow-[0_4px_20px_rgba(255,42,42,0.35)] transition-all cursor-pointer";
        if (btnSaveAudio) {
          if (data.audio) btnSaveAudio.classList.remove('hidden');
          else btnSaveAudio.classList.add('hidden');
        }
      }

      document.getElementById('reelTitle').innerHTML = `${data.title} <span id="reelBadge" class="text-[10px] px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-300 mono font-bold">${data.dur}</span>`;
      document.getElementById('reelDesc').innerText = data.desc;

      const keys = ['dull_boy', 'reel14', 'spicewood_full', 'spicewood_audio', 'spicewood_act1', 'spicewood_act2', 'spicewood_act3', 'spicewood_beat', 'ogygia', 'reel8', 'reel6', 'reel4', 'reel2'];
      const inactiveClass = "py-1.5 px-3 rounded-xl text-xs font-bold transition-all text-zinc-400 hover:text-zinc-200 flex items-center justify-center gap-1 shrink-0";
      
      keys.forEach(k => {
        const btnId = k === 'dull_boy' ? 'btnDullBoy'
          : (k === 'reel14' ? 'btnReel14'
          : (k === 'spicewood_full' ? 'btnSpicewoodFull'
          : (k === 'spicewood_audio' ? 'btnSpicewoodAudio'
          : (k === 'spicewood_act1' ? 'btnSpicewoodAct1'
          : (k === 'spicewood_act2' ? 'btnSpicewoodAct2'
          : (k === 'spicewood_act3' ? 'btnSpicewoodAct3'
          : (k === 'spicewood_beat' ? 'btnSpicewoodBeat'
          : (k === 'ogygia' ? 'btnOgygia'
          : `btn${k.charAt(0).toUpperCase() + k.slice(1)}`))))))));
        const btn = document.getElementById(btnId);
        if (btn) {
          if (k === key) {
            if (k === 'dull_boy') {
              btn.className = "py-1.5 px-3 rounded-xl text-xs font-bold transition-all bg-red-600 text-white font-extrabold shadow flex items-center justify-center gap-1 shrink-0";
            } else if (k === 'reel14') {
              btn.className = "py-1.5 px-3 rounded-xl text-xs font-bold transition-all bg-[#8B9A46] text-black font-extrabold shadow flex items-center justify-center gap-1 shrink-0";
            } else if (k.startsWith('spicewood')) {
              btn.className = "py-1.5 px-3 rounded-xl text-xs font-bold transition-all bg-amber-500 text-black shadow flex items-center justify-center gap-1 shrink-0";
            } else if (k === 'reel8') {
              btn.className = "py-1.5 px-3 rounded-xl text-xs font-bold transition-all bg-[#38BDF8] text-black shadow flex items-center justify-center gap-1 shrink-0";
            } else {
              btn.className = "py-1.5 px-3 rounded-xl text-xs font-bold transition-all bg-red-600 text-white shadow flex items-center justify-center gap-1 shrink-0";
            }
          } else {
            btn.className = inactiveClass;
          }
        }
      });
    }

    async function downloadActiveReel(type) {
      const data = REELS_DATA[activeReelKey];
      if (!data) return;
      const url = (type === 'audio' || data.isAudio) ? data.audio : data.video;
      const filename = url ? url.split('/').pop() : `${activeReelKey}.mp4`;
      await downloadOrShareMedia(url, filename);
    }

    async function downloadOrShareMedia(url, filename) {
      showToast(`⏳ Preparing ${filename}...`, 2000);
      try {
        const res = await fetch(url);
        if (!res.ok) {
          throw new Error(`Server returned HTTP ${res.status}`);
        }
        const ctype = res.headers.get('content-type') || '';
        if (ctype.includes('text/html') && !filename.endsWith('.html')) {
          throw new Error('Server returned an error page instead of media file');
        }
        const blob = await res.blob();
        if (!blob || blob.size === 0) {
          throw new Error('Downloaded file was empty');
        }

        const mimeType = blob.type || (filename.endsWith('.mp4') ? 'video/mp4' : (filename.endsWith('.mp3') ? 'audio/mpeg' : 'application/octet-stream'));
        const file = new File([blob], filename, { type: mimeType });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: filename,
              text: 'VoiceFi: ' + filename
            });
            showToast(`✅ Saved / Shared ${filename}`, 3000);
            return;
          } catch (shareErr) {
            if (shareErr.name === 'AbortError') return;
            console.log('navigator.share fallback to blob URL save:', shareErr);
          }
        }

        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 15000);
        showToast(`✅ Downloaded ${filename} (${(blob.size / 1048576).toFixed(1)} MB)`, 3500);
      } catch (err) {
        console.error('Download error:', err);
        showToast(`❌ Download failed: ${err.message}`, 4000);
      }
    }

    async function forceHardRefresh() {
      const btn = document.getElementById('btnHardRefresh');
      if (btn) btn.classList.add('animate-spin');
      if ('serviceWorker' in navigator) {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let registration of registrations) {
            await registration.unregister();
          }
        } catch (e) {}
      }
      if ('caches' in window) {
        try {
          const keys = await caches.keys();
          for (let key of keys) {
            await caches.delete(key);
          }
        } catch (e) {}
      }
      window.location.href = window.location.pathname + '?reload=' + Date.now();
    }

    // Initialize REEL-014 on page load
    selectReel('reel14');
  </script>
