<!DOCTYPE html>
<html lang="en" class="bg-black text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VoiceFi™ · Mobile Downloads</title>
  <meta name="theme-color" content="#000000">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #080A0F;
      color: #F8FAFC;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-5 pb-8 safe-area">
  <!-- Top Navigation & Brand Header -->
  <header class="w-full max-w-md flex items-center justify-between py-3 border-b border-gray-800">
    <div class="flex items-center gap-3">
      <a href="/" class="px-2.5 py-1 rounded-lg bg-gray-900 border border-gray-800 text-xs font-bold text-gray-300 hover:text-white flex items-center gap-1 active:scale-95 transition-all" title="Back to Voice Screen">
        <span>←</span> <span>Voice</span>
      </a>
      <div>
        <h1 class="text-sm font-extrabold tracking-tight">Downloads</h1>
        <p class="text-[10px] text-gray-400 font-medium">Reels & Master Media</p>
      </div>
    </div>
    <span class="px-2.5 py-1 rounded-full bg-[#8B9A46]/20 border border-[#8B9A46]/50 text-[#A2B354] font-mono text-[11px] font-bold uppercase">
      🏆 Master
    </span>
  </header>

  <!-- Main Card & Video Preview -->
  <main class="w-full max-w-md my-auto flex flex-col items-center gap-4 py-3">
    <!-- Reel Selector Pills -->
    <div class="w-full flex items-center justify-start p-1 bg-zinc-900/90 border border-zinc-800 rounded-2xl gap-1 overflow-x-auto no-scrollbar">
      <button id="btnReel6" onclick="selectReel('reel6')" class="py-2 px-3 rounded-xl text-xs font-bold transition-all bg-[#8B9A46] text-black font-extrabold shadow-lg flex items-center justify-center gap-1 shrink-0">
        <span>⚡</span> <span>Speed Listening</span> <span class="text-[10px] px-1.5 py-0.2 rounded bg-black/30 text-white">35s</span>
      </button>
      <button id="btnReel4" onclick="selectReel('reel4')" class="py-2 px-3 rounded-xl text-xs font-bold transition-all text-zinc-400 hover:text-zinc-200 flex items-center justify-center gap-1 shrink-0">
        <span>🎬</span> <span>How We Built</span> <span class="text-[10px] px-1.5 py-0.2 rounded bg-zinc-800 text-zinc-400">50s</span>
      </button>
      <button id="btnReel3" onclick="selectReel('reel3')" class="py-2 px-3 rounded-xl text-xs font-bold transition-all text-zinc-400 hover:text-zinc-200 flex items-center justify-center gap-1 shrink-0">
        <span>🎙️</span> <span>Free Voice</span> <span class="text-[10px] px-1.5 py-0.2 rounded bg-zinc-800 text-zinc-400">16s</span>
      </button>
      <button id="btnReel2" onclick="selectReel('reel2')" class="py-2 px-3 rounded-xl text-xs font-bold transition-all text-zinc-400 hover:text-zinc-200 flex items-center justify-center gap-1 shrink-0">
        <span>🎤</span> <span>Rap Battle</span> <span class="text-[10px] px-1.5 py-0.2 rounded bg-zinc-800 text-zinc-400">77s</span>
      </button>
    </div>

    <!-- Video Player Preview Container -->
    <div id="videoBorder" class="relative w-full aspect-[9/16] max-w-[270px] bg-black rounded-3xl overflow-hidden border-2 border-[#8B9A46]/60 shadow-[0_0_40px_rgba(139,154,70,0.3)] flex items-center justify-center">
      <video id="reelVideo" src="/downloads/reel_006_speed_listening_9_16.mp4" playsinline controls loop class="w-full h-full object-cover"></video>
    </div>

    <!-- Title & Specs -->
    <div class="text-center px-2">
      <h2 id="reelTitle" class="text-base font-black tracking-tight text-white flex items-center justify-center gap-2">
        ⚡ The Speed Listening Challenge <span id="reelBadge" class="text-xs px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 mono font-bold">35s</span>
      </h2>
      <p id="reelDesc" class="text-xs text-zinc-400 mt-1">Jake's solo live take + 400 & 600 WPM acceleration + Google Veo 2D flipbook sketch animation</p>
    </div>

    <!-- Download Buttons -->
    <div class="w-full flex flex-col gap-2.5">
      <!-- Primary: Save Reel to Photos / Downloads -->
      <a id="btnSave916" href="/downloads/reel_006_speed_listening_9_16.mp4" download="reel_006_speed_listening_9_16.mp4" class="w-full py-3.5 px-5 rounded-2xl bg-[#8B9A46] hover:bg-[#9CB04F] active:scale-[0.98] text-black font-extrabold text-base flex items-center justify-center gap-3 shadow-[0_4px_25px_rgba(139,154,70,0.4)] transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        <span>Save 9:16 Video Reel (.mp4)</span>
      </a>

      <!-- Secondary: Direct Browser View / Share -->
      <button onclick="shareCurrentVideo()" class="w-full py-3 px-4 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 active:scale-[0.98] text-zinc-200 font-bold text-sm flex items-center justify-center gap-2 transition-all">
        <span>📲 Share Directly to TikTok / Instagram</span>
      </button>
    </div>
  </main>

  <!-- Footer Link back to Companion -->
  <footer class="w-full max-w-md text-center pt-2">
    <a href="/" class="text-xs text-zinc-500 hover:text-zinc-300 font-medium transition-colors">
      ← Back to VoiceFi Companion Voice Loop
    </a>
  </footer>

  <script>
    const REELS_DATA = {
      reel6: {
        title: "⚡ The Speed Listening Challenge",
        dur: "35s",
        desc: "Jake's solo live take + 400 & 600 WPM acceleration + Google Veo 2D flipbook sketch animation",
        reel916: "/downloads/reel_006_speed_listening_9_16.mp4",
        themeColor: "#8B9A46",
        btnColorClass: "bg-[#8B9A46] text-black font-extrabold shadow-lg"
      },
      reel4: {
        title: "🎬 How We Built VoiceFi · Hybrid Master",
        dur: "50s",
        desc: "Jake's real voice intro + Viv, Steffan, Christopher & Emily pencil flipbook",
        reel916: "/downloads/hybrid_how_we_built_voicefi_reel_9_16.mp4",
        themeColor: "#10B981",
        btnColorClass: "bg-emerald-600 text-white font-bold shadow-lg"
      },
      reel3: {
        title: "🎙️ Free Your Voice · Studio Radio Master",
        dur: "16s",
        desc: "Spoken tagline with Booming Radio Announcer DSP & synced cards",
        reel916: "/downloads/free_your_voice_reel.mp4",
        themeColor: "#A855F7",
        btnColorClass: "bg-purple-600 text-white font-bold shadow-lg"
      },
      reel2: {
        title: "🎤 AI Rap Battle · Viv vs Claude",
        dur: "77s",
        desc: "Savage AI smack talk with 808 Boom-Bap Beat & Scratches",
        reel916: "/downloads/ai_rap_battle_viv_claude_reel.mp4",
        themeColor: "#EF4444",
        btnColorClass: "bg-red-600 text-white font-bold shadow-lg"
      }
    };

    let activeReelKey = "reel6";

    function selectReel(key) {
      activeReelKey = key;
      const data = REELS_DATA[key];
      const video = document.getElementById('reelVideo');
      video.src = data.reel916;
      video.load();

      document.getElementById('reelTitle').innerHTML = `${data.title} <span id="reelBadge" class="text-xs px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 mono font-bold">${data.dur}</span>`;
      document.getElementById('reelDesc').innerText = data.desc;

      const btnSave916 = document.getElementById('btnSave916');
      btnSave916.href = data.reel916;
      btnSave916.download = `${key}_master.mp4`;

      const keys = ['reel6', 'reel4', 'reel3', 'reel2'];
      const inactiveClass = "py-2 px-3 rounded-xl text-xs font-bold transition-all text-zinc-400 hover:text-zinc-200 flex items-center justify-center gap-1 shrink-0";
      
      keys.forEach(k => {
        const btn = document.getElementById(`btn${k.charAt(0).toUpperCase() + k.slice(1)}`);
        if (btn) {
          if (k === key) {
            btn.className = `py-2 px-3 rounded-xl text-xs transition-all ${data.btnColorClass} flex items-center justify-center gap-1 shrink-0`;
          } else {
            btn.className = inactiveClass;
          }
        }
      });
    }

    async function shareCurrentVideo() {
      const data = REELS_DATA[activeReelKey];
      try {
        if (navigator.share) {
          await navigator.share({
            title: data.title,
            text: data.desc,
            url: window.location.origin + data.reel916
          });
        } else {
          window.location.href = data.reel916;
        }
      } catch (err) {
        window.location.href = data.reel916;
      }
    }
  </script>
</body>
</html>
