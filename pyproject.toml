[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicefi"
version = "0.2.1"
description = "Giving your agents a voice, and your voice agency. Universal voice layer for AI coding agents and macOS desktop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jake Trigg" }
]
keywords = ["voice", "voicefi", "vifi", "agency", "voicegency", "ai", "antigravity", "claude", "agent", "whisper", "tts", "stt", "speech-to-text", "hands-free"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.0",
    "requests>=2.31.0",
    "pynput>=1.7.6",
    "rumps>=0.4.0; sys_platform == 'darwin'",
    "aiohttp>=3.9.0",
    "qrcode>=7.4.2",
    "pillow>=10.0.0",
    "posthog>=7.43.0",
    "psutil>=5.9.0",
    "cryptography>=41.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "google-genai>=1.65.0",
]
local = [
    "google-antigravity>=0.1.18",
    "litert-lm>=0.17.1",
]

[project.scripts]
voicefi = "voicefi.cli:main"
vifi = "voicefi.cli:main"
vg = "voicefi.cli:main"
voicegency = "voicefi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voicefi"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    ".agents",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    ".claude",
    ".agents",
    "dist",
    "build",
    "assets",
    "scratch",
    "mocks",
    "obsidian-plugin",
    "test_*.py",
    "patch.py",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
]
ignore = [
    "E501",
    "W293",
    "W291",
    "E402",
    "E741",
    "F841",
    "F401",
]


