[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicegency"
version = "0.1.0"
description = "Giving your agents a voice, and your voice agency. Hands-free voice layer for AI coding agents and macOS desktop use"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jake Trigg" }
]
keywords = ["voice", "agency", "voicegency", "ai", "antigravity", "agent", "whisper", "tts", "stt", "speech-to-text", "hands-free"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.0",
    "requests>=2.31.0",
    "pynput>=1.7.6",
    "rumps>=0.4.0",
    "aiohttp>=3.9.0",
    "qrcode>=7.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
]

[project.scripts]
voicegency = "voicegency.cli:main"
vg = "voicegency.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voicegency"]

[tool.pytest.ini_options]
testpaths = ["tests"]

