name: "🐛 Bug Report"
description: "File a bug report for an audio glitch, CLI crash, MCP tool error, or agent hook issue."
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem in VoiceFi!
        Please search existing [Open Issues](https://github.com/atxatlarge-code/voicefi/issues) before submitting.

  - type: dropdown
    id: os_version
    attributes:
      label: Operating System & Version
      description: What OS are you running VoiceFi on?
      options:
        - "macOS 16 Tahoe"
        - "macOS 15 Sequoia"
        - "macOS 14 Sonoma"
        - "macOS 13 Ventura"
        - "Linux / WSL2"
        - "Windows"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Hardware Architecture
      description: What processor architecture does your device use?
      options:
        - "Apple Silicon (M1/M2/M3/M4 / Pro / Max / Ultra)"
        - "Intel (x86_64)"
        - "ARM64 (Linux / Other)"
        - "AMD64 (x86_64 Linux/Windows)"
    validations:
      required: true

  - type: input
    id: voicefi_version
    attributes:
      label: VoiceFi Version
      description: Run `vifi --version` or provide your git commit SHA.
      placeholder: "e.g., 0.1.0 or commit 3a4b5c6"
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python & Environment
      description: Output of `python3 --version` and package manager (uv, venv, brew, pip).
      placeholder: "e.g., Python 3.12.3 with uv venv"
    validations:
      required: true

  - type: dropdown
    id: integration_surface
    attributes:
      label: Primary Surface / Component
      description: Where did the issue occur?
      options:
        - "CLI (`vifi speak`, `vifi listen`, `vifi dev`, etc.)"
        - "MCP Stdio Tools (`voicefi_speak`, `voicefi_listen`, `voicefi_send`, etc.)"
        - "REST API (`http://localhost:5141/api/*`)"
        - "Google Antigravity Agent Hook"
        - "Claude Code Hook & CLI Injector"
        - "Dynamic Island HUD (AppKit floating overlay)"
        - "Voice Engine / TTS (Ava, Edge-TTS, ElevenLabs, Kokoro)"
        - "Audio Recording / VAD / Barge-In"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: audio_device
    attributes:
      label: Connected Audio Devices
      description: What input/output devices were active?
      options:
        - "Built-in Microphone & Built-in Speakers"
        - "AirPods / Bluetooth Headphones"
        - "Wired 3.5mm Headset / Headphones"
        - "USB Audio Interface / Dedicated XLR Microphone"
        - "External Display Speakers / HDMI Audio"
        - "No physical audio device (Headless / Remote)"
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Run `vifi voice set antigravity "Ava (Premium)"`
        2. Execute `vifi speak "Testing speech synthesis"`
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior vs Actual Behavior
      description: What did you expect to happen, and what happened instead?
      placeholder: "Expected clear speech synthesis through headphones, but received audio device error..."
    validations:
      required: true

  - type: textarea
    id: diagnostic_output
    attributes:
      label: Diagnostic Profile (`vifi troubleshoot --json`) & Logs
      description: Please paste the output of `vifi troubleshoot --json` or relevant terminal logs.
      render: json
      placeholder: |
        {
          "system": { "os": "Darwin", "arch": "arm64" },
          "audio": { "default_input": "MacBook Pro Microphone", "default_output": "AirPods Pro" }
        }
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Pre-Submission Checklist
      options:
        - label: "I searched existing issues and confirmed this is not a duplicate."
          required: true
        - label: "I verified that my logs do not contain API keys, passwords, or personal data."
          required: true
        - label: "I tested on the latest VoiceFi version or local main branch."
          required: false
