name: CI

on:
  push:
    branches: [main, master, "release/**"]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
      - "assets/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
      - "assets/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run full Python version matrix (3.10, 3.11, 3.12)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    name: Configure Matrix
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.set-matrix.outputs.python-versions }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_matrix }}" = "true" ] || [[ "${{ github.ref }}" =~ ^refs/tags/v ]] || [[ "${{ github.ref }}" =~ ^refs/heads/release/ ]]; then
            echo 'python-versions=["3.10", "3.11", "3.12"]' >> "$GITHUB_OUTPUT"
          else
            echo 'python-versions=["3.12"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test (${{ matrix.os }} - Py${{ matrix.python-version }})
    needs: configure
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ${{ fromJson(needs.configure.outputs.python-versions) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-dev ffmpeg

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install portaudio ffmpeg || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run Test Suite
        env:
          VOICEFI_ENV: test
          VOICEFI_MOCK_AUDIO: "1"
          VOICEFI_HEADLESS: "1"
          VOICEFI_TESTING: "1"
          VOICEFI_TELEMETRY: "0"
          DO_NOT_TRACK: "1"
          CI: "true"
        run: |
          pytest tests/ -v
